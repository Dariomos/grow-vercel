  <!-- Top leaf -->
  <ellipse cx="256" cy="160" rx="45" ry="22" fill="#F7F3ED" opacity="0.95" transform="rotate(-10 256 160)"/>
  <!-- Sparkle -->
  <circle cx="380" cy="120" r="8" fill="#C8872A" opacity="0.8"/>
