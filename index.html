          </div>
        )}
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════════
   ARIA CHAT — con selección de pilar y generación de calendario
   ═══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
   SUGGEST CARD — ARIA propone actividad, usuario acepta o rechaza
   ═══════════════════════════════════════════════════════════════ */
function SuggestCard({ suggest, pillar, onConfirm, onDecline }) {
  const today = new Date().toISOString().slice(0,10);
  const [durVal,  setDurVal]  = useState(3);
  const [durUnit, setDurUnit] = useState("semanas");
  const [time,    setTime]    = useState(suggest.time || "07:00");
  const [answered, setAnswered] = useState(false);
  const [accepted, setAccepted] = useState(false);

  const pillarData = ALL_PILLARS.find(p=>p.id===(suggest.pillarId||pillar)) || ALL_PILLARS[0];
  const DIAS_ALL = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
  const daysMap  = { lunes:"L", martes:"M", miércoles:"X", jueves:"J", viernes:"V", sábado:"S", domingo:"D" };

  function computeEnd() {
    const d = new Date(today+"T12:00");
    if (durUnit==="semanas") d.setDate(d.getDate()+durVal*7-1);
    else d.setDate(d.getDate()+durVal-1);
    return d.toISOString().slice(0,10);
  }

  function fmtDate(str) {
    return new Date(str+"T12:00").toLocaleDateString("es",{day:"numeric",month:"long"});
  }

  function buildTasks() {
    const list = [];
    const start = new Date(today+"T12:00");
    const end   = new Date(computeEnd()+"T12:00");
    const diaNames = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const activeDias = suggest.dias && suggest.dias.length > 0 ? suggest.dias : DIAS_ALL;
    let d = new Date(start), idx = 0;
    while (d <= end) {
      if (activeDias.includes(diaNames[d.getDay()])) {
        list.push({
          id: Date.now()+idx++,
          pillarId: pillarData.id,
          text: suggest.title + (suggest.duracion ? " · "+suggest.duracion : ""),
          dueDate: d.toISOString().slice(0,10),
          time: time,
          done: false,
          doneAt: null,
          recurring: true,
        });
      }
      d.setDate(d.getDate()+1);
    }
    return list;
  }

  async function handleYes() {
    if ("Notification" in window && Notification.permission !== "granted") {
      await Notification.requestPermission();
    }
    if (Notification?.permission === "granted") {
      new Notification(`🌿 ${suggest.title} programado`, {
        body: `${time} · ${suggest.frecuencia} · ${durVal} ${durUnit}`,
        icon: "/icons/icon-192.png",
      });
    }
    const tasks = buildTasks();
    onConfirm && onConfirm(tasks);
    setAccepted(true);
    setAnswered(true);
  }

  function handleNo() {
    onDecline && onDecline();
    setAnswered(true);
    setAccepted(false);
  }

  if (answered) {
    return (
      <div style={{
        background: accepted ? `${pillarData.color}12` : `${T.border}`,
        border: `1px solid ${accepted ? pillarData.color+"33" : T.border}`,
        borderRadius:14, padding:"12px 16px",
        display:"flex", alignItems:"center", gap:10,
      }}>
        <span style={{fontSize:20}}>{accepted?"🌱":"👋"}</span>
        <div>
          <div style={{fontSize:13, color:accepted?pillarData.color:T.muted, fontWeight:500}}>
            {accepted ? `¡Listo! "${suggest.title}" está en tus Tareas` : "De acuerdo, seguimos cuando quieras"}
          </div>
          {accepted && <div style={{fontSize:11,color:T.muted,marginTop:2}}>Revisa el tab Tareas · {buildTasks().length} actividades generadas</div>}
        </div>
      </div>
    );
  }

  return (
    <div className="bt-bloom" style={{
      background:`linear-gradient(135deg,${pillarData.color}10,${T.card})`,
      border:`1.5px solid ${pillarData.color}55`,
      borderRadius:18, padding:"16px 18px",
      boxShadow:`0 6px 24px ${pillarData.color}18`,
    }}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div style={{width:40,height:40,borderRadius:12,background:pillarData.colorDim,
          border:`1px solid ${pillarData.color}44`,display:"flex",alignItems:"center",
          justifyContent:"center",fontSize:20,flexShrink:0}}>{pillarData.icon}</div>
        <div style={{flex:1}}>
          <div style={{fontFamily:T.display,fontSize:16,fontWeight:500,color:T.ink}}>{suggest.title}</div>
          <div style={{fontSize:10,color:pillarData.color,letterSpacing:1,textTransform:"uppercase",marginTop:1}}>{pillarData.name}</div>
        </div>
      </div>

      {/* Pregunta */}
      <div style={{fontSize:14,color:T.ink,marginBottom:14,lineHeight:1.5,fontFamily:T.display,fontStyle:"italic"}}>
        {suggest.pregunta || `¿Agregamos "${suggest.title}" a tus tareas de ${pillarData.name}?`}
      </div>

      {/* Config compacta */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 12px"}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:4}}>🕐 Hora</div>
          <input type="time" value={time} onChange={e=>setTime(e.target.value)}
            style={{fontSize:13,color:T.ink,background:"transparent",border:"none",outline:"none",fontFamily:T.mono,width:"100%"}}/>
        </div>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 12px"}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:4}}>⏱️ Sesión</div>
          <div style={{fontSize:13,color:T.ink}}>{suggest.duracion}</div>
        </div>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 12px"}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:4}}>🔁 Frecuencia</div>
          <div style={{fontSize:12,color:T.ink}}>{suggest.frecuencia}</div>
        </div>
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 12px"}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:4}}>📅 Inicio</div>
          <div style={{fontSize:12,color:T.ink}}>{fmtDate(today)} <span style={{fontSize:10,color:pillarData.color}}>hoy</span></div>
        </div>
      </div>

      {/* Días */}
      {suggest.dias && suggest.dias.length > 0 && (
        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
          {DIAS_ALL.map(d=>{
            const active = suggest.dias.includes(d);
            return <div key={d} style={{width:28,height:28,borderRadius:7,
              background:active?pillarData.color:T.border,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:9,color:active?"#fff":T.muted,fontFamily:T.mono,fontWeight:active?700:300}}>
              {daysMap[d]}
            </div>;
          })}
        </div>
      )}

      {/* Duración total */}
      <div style={{background:`${pillarData.color}08`,border:`1px solid ${pillarData.color}22`,
        borderRadius:12,padding:"10px 14px",marginBottom:14}}>
        <div style={{fontSize:11,color:T.muted,marginBottom:8}}>Duración del plan</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>setDurVal(p=>Math.max(1,p-1))}
            style={{width:28,height:28,borderRadius:8,background:T.surface,border:`1px solid ${T.border}`,
              fontSize:16,cursor:"pointer",color:T.ink,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
          <div style={{fontFamily:T.mono,fontSize:18,color:pillarData.color,fontWeight:"bold",minWidth:24,textAlign:"center"}}>{durVal}</div>
          <button onClick={()=>setDurVal(p=>p+1)}
            style={{width:28,height:28,borderRadius:8,background:T.surface,border:`1px solid ${T.border}`,
              fontSize:16,cursor:"pointer",color:T.ink,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
          {["semanas","dias"].map(u=>(
            <button key={u} onClick={()=>setDurUnit(u)}
              style={{padding:"5px 12px",borderRadius:8,
                border:`1px solid ${durUnit===u?pillarData.color+"66":T.border}`,
                background:durUnit===u?pillarData.colorDim:"transparent",
                fontSize:12,color:durUnit===u?T.ink:T.muted,cursor:"pointer",fontFamily:T.body}}>
              {u}
            </button>
          ))}
        </div>
        <div style={{fontSize:11,color:T.muted,marginTop:8,textAlign:"center",fontStyle:"italic",fontFamily:T.display}}>
          ~{buildTasks().length} sesiones · hasta el {fmtDate(computeEnd())}
        </div>
      </div>

      {/* Nota motivacional */}
      {suggest.nota && (
        <div style={{fontSize:12,color:T.muted,fontFamily:T.display,fontStyle:"italic",
          lineHeight:1.6,marginBottom:14,paddingLeft:10,borderLeft:`2px solid ${pillarData.color}44`}}>
          "{suggest.nota}"
        </div>
      )}

      {/* Botones Sí / No */}
      <div style={{display:"flex",gap:10}}>
        <button onClick={handleYes} className="bt-btn"
          style={{flex:2,background:`linear-gradient(135deg,${pillarData.color},${pillarData.color}cc)`,
            border:"none",borderRadius:12,padding:"13px",color:"#fff",fontSize:14,
            cursor:"pointer",fontFamily:T.body,fontWeight:500,
            display:"flex",alignItems:"center",justifyContent:"center",gap:8,
            boxShadow:`0 4px 16px ${pillarData.color}44`}}>
          ✅ Sí, agregar a mis Tareas
        </button>
        <button onClick={handleNo}
          style={{flex:1,background:"transparent",border:`1px solid ${T.border}`,
            borderRadius:12,padding:"13px",color:T.muted,fontSize:13,
            cursor:"pointer",fontFamily:T.body}}>
          No por ahora
        </button>
      </div>
    </div>
  );
}



function AriaChat({ systemPrompt, initialMsg, myPillars, onAddTasks }) {
  const [phase,       setPhase]       = useState("pillar_select"); // pillar_select | chat
  const [selPillar,   setSelPillar]   = useState(null);
  const [msgs,        setMsgs]        = useState([]);
  const [input,       setInput]       = useState("");
  const [loading,     setLoading]     = useState(false);
  const [calEvent,    setCalEvent]    = useState(null);   // parsed calendar event
  const [calPillar,   setCalPillar]   = useState(null);
  const chatEndRef                    = useRef(null);

  useEffect(()=>{ chatEndRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs,loading]);

  function choosePillar(pillar) {
    setSelPillar(pillar);
    setPhase("chat");
    const greeting = `${initialMsg}\n\nHe seleccionado trabajar en **${pillar.name}** ${pillar.icon}\n\n¿Sobre qué actividad o hábito de ${pillar.name} te gustaría que te ayude a programar hoy?`;
    setMsgs([{ role:"assistant", text: greeting, type:"text" }]);
  }

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    setInput("");
    const next = [...msgs, { role:"user", text, type:"text" }];
    setMsgs(next);
    setLoading(true);

    // System prompt for this pillar session, including calendar JSON instruction
    const calSystem = systemPrompt + `

Pilar activo en esta sesión: ${selPillar?.name} ${selPillar?.icon}.

REGLA FUNDAMENTAL — DE LA CONVERSACIÓN A LA ACCIÓN:
Tu rol es acompañar al usuario desde la motivación hasta una acción concreta. Flujo natural:
1. Escucha, motiva, haz preguntas que ayuden a clarificar qué actividad quiere hacer.
2. Cuando juntos lleguen a una actividad específica y realista — ya sea porque el usuario la mencionó, o porque tú la sugeriste y el usuario mostró interés — PROPÓN incluirla en sus tareas.
3. Responde en DOS partes:
   a) Mensaje motivacional corto (máx 80 palabras) que describa la actividad acordada y pregunte si la quiere programar.
   b) Inmediatamente, sin texto extra:

SUGGEST_JSON:{"title":"nombre corto","time":"HH:MM","frecuencia":"diario|lunes a viernes|fines de semana|personalizado","duracion":"Xmin","dias":["lunes","martes","miércoles","jueves","viernes","sábado","domingo"],"nota":"frase motivacional breve","pillarId":"${selPillar?.id}","pregunta":"¿Agregamos esto a tus tareas de ${selPillar?.name}?"}

Reglas estrictas:
- Sugiere una hora realista según el contexto del usuario (mañana, tarde, noche).
- Incluye en "dias" solo los que correspondan a la frecuencia.
- NO incluyas startDate ni endDate — el usuario los configurará.
- Solo incluye SUGGEST_JSON cuando tengas una actividad concreta lista para proponer.
- Si el usuario aún está explorando, sigue la conversación sin el bloque.
- Si el usuario responde que NO quiere programarla, simplemente continúa la conversación sin volver a sugerir lo mismo.`;

    try {
      const res = await fetch("/api/aria", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          system: calSystem,
          messages: (()=>{
            const apiMsgs = next
              .filter(m => m.text && m.text.trim() && m.type !== "calendar" && m.type !== "suggest")
              .map(m => ({ role: m.role, content: m.text }));
            // API requires first message to be from user
            while (apiMsgs.length > 0 && apiMsgs[0].role !== "user") apiMsgs.shift();
            return apiMsgs;
          })(),
        }),
      });
      const data = await res.json();
      console.log("API response:", JSON.stringify(data).slice(0,500));
      if (data.error) throw new Error(`API Error: ${data.error.message || data.error.type || JSON.stringify(data.error)}`);
      if (!data.content) throw new Error(`Sin respuesta. Detalle: ${JSON.stringify(data).slice(0,400)}`);
      const raw  = data.content?.map(b=>b.text||"").join("") || "…";

      // Parse SUGGEST_JSON if present
      const sugIdx = raw.indexOf("SUGGEST_JSON:");
      const calIdx = raw.indexOf("CALENDAR_JSON:"); // legacy fallback
      if (sugIdx !== -1) {
        const jsonStr = raw.slice(sugIdx + "SUGGEST_JSON:".length).trim();
        const msgText = raw.slice(0, sugIdx).trim();
        try {
          const parsed = JSON.parse(jsonStr);
          setMsgs(p=>[...p,
            { role:"assistant", text: msgText, type:"text" },
            { role:"assistant", text:"", type:"suggest", suggest: parsed, pillar: selPillar?.id }
          ]);
        } catch {
          setMsgs(p=>[...p, { role:"assistant", text: raw, type:"text" }]);
        }
      } else if (calIdx !== -1) {
        // Legacy CALENDAR_JSON support
        const jsonStr = raw.slice(calIdx + "CALENDAR_JSON:".length).trim();
        const msgText = raw.slice(0, calIdx).trim();
        try {
          const parsed = JSON.parse(jsonStr);
          setCalEvent(parsed);
          setCalPillar(selPillar?.id);
          setMsgs(p=>[...p, { role:"assistant", text: msgText, type:"text" }, { role:"assistant", text:"", type:"calendar", event: parsed, pillar: selPillar?.id }]);
        } catch {
          setMsgs(p=>[...p, { role:"assistant", text: raw, type:"text" }]);
        }
      } else {
        setMsgs(p=>[...p, { role:"assistant", text: raw, type:"text" }]);
      }
    } catch(err) {
      console.error("ARIA error:", err);
      setMsgs(p=>[...p, { role:"assistant", text:`Error: ${err?.message || JSON.stringify(err)}`, type:"text" }]);
    }
    setLoading(false);
  }

  /* ── PHASE: Pillar selection ─────────────────────────────── */
  if (phase === "pillar_select") {
    return (
      <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0,overflow:"hidden"}}>
        {/* Header */}
        <div style={{padding:"14px 18px",background:T.surface,borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:42,height:42,borderRadius:"50%",background:`linear-gradient(145deg,${T.forest}22,${T.amber}18)`,border:`1.5px solid ${T.forest}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,animation:"bt-breathe 3.5s ease infinite"}}>🌿</div>
          <div>
            <div style={{fontFamily:T.display,fontSize:16,fontWeight:500,color:T.ink}}>ARIA</div>
            <div style={{fontSize:10,color:T.forest,fontWeight:300}}>● Activa · Grow by Building Together</div>
          </div>
        </div>

        {/* Pillar picker */}
        <div className="grow-scroll" style={{padding:"20px 16px 80px 16px",display:"flex",flexDirection:"column",gap:16,background:`linear-gradient(180deg,${T.surface},${T.bg})`}}>
          <div className="bt-rise">
            <div style={{fontFamily:T.display,fontSize:22,fontWeight:300,color:T.ink,marginBottom:4}}>¿En qué pilar trabajamos hoy?</div>
            <div style={{fontSize:13,color:T.muted,fontWeight:300,lineHeight:1.6}}>Elige uno de tus pilares activos. Puedes cambiar en cualquier momento.</div>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {myPillars.map((p,i)=>(
              <div key={p.id} className="bt-card"
                onClick={()=>choosePillar(p)}
                style={{
                  background:T.card,
                  border:`1.5px solid ${T.border}`,
                  borderRadius:16,padding:"14px 16px",
                  cursor:"pointer",
                  display:"flex",alignItems:"center",gap:14,
                  boxShadow:`0 2px 10px ${T.sand}33`,
                  animation:`bt-rise .4s ease ${i*0.06}s both`,
                  transition:"all .22s ease",
                }}
                onMouseEnter={e=>{ e.currentTarget.style.background=p.colorDim; e.currentTarget.style.borderColor=p.color+"66"; }}
                onMouseLeave={e=>{ e.currentTarget.style.background=T.card; e.currentTarget.style.borderColor=T.border; }}
              >
                <div style={{width:46,height:46,borderRadius:14,flexShrink:0,background:`linear-gradient(145deg,${p.color}22,${p.color}08)`,border:`1px solid ${p.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>
                  {p.icon}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:T.display,fontSize:16,fontWeight:400,color:T.ink,marginBottom:2}}>{p.name}</div>
                  <div style={{fontSize:11,color:T.muted,fontStyle:"italic",fontFamily:T.display}}>{p.quote}</div>
                </div>
                <span style={{fontSize:18,color:p.color,opacity:.5}}>→</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  /* ── PHASE: Chat ─────────────────────────────────────────── */
  const pillarData = ALL_PILLARS.find(p=>p.id===selPillar?.id) || selPillar;
  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0,overflow:"hidden"}}>
      {/* Header */}
      <div style={{padding:"12px 16px",background:T.surface,borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:38,height:38,borderRadius:"50%",background:`linear-gradient(145deg,${T.forest}22,${T.amber}18)`,border:`1.5px solid ${T.forest}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,animation:"bt-breathe 3.5s ease infinite"}}>🌿</div>
        <div style={{flex:1}}>
          <div style={{fontFamily:T.display,fontSize:15,fontWeight:500,color:T.ink}}>ARIA</div>
          <div style={{fontSize:9,color:T.forest,fontWeight:300}}>● Activa · Grow by Building Together</div>
        </div>
        {/* Pillar badge + change button */}
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{background:pillarData?.colorDim,border:`1px solid ${pillarData?.color}44`,borderRadius:10,padding:"4px 10px",display:"flex",alignItems:"center",gap:5}}>
            <span style={{fontSize:14}}>{pillarData?.icon}</span>
            <span style={{fontSize:10,color:T.ink,fontFamily:T.body}}>{pillarData?.name}</span>
          </div>
          <button onClick={()=>{setPhase("pillar_select");setMsgs([]);setCalEvent(null);}}
            style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:8,padding:"4px 10px",fontSize:10,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
            cambiar
          </button>
        </div>
      </div>

      {/* Messages */}
      <div className="grow-scroll" style={{padding:"16px 14px",display:"flex",flexDirection:"column",gap:12,background:`linear-gradient(180deg,${T.surface},${T.bg})`}}>
        {msgs.map((m,i)=>{
          if (m.type === "suggest") {
            return (
              <div key={i} className="bt-rise" style={{paddingLeft:36}}>
                <SuggestCard
                  suggest={m.suggest}
                  pillar={m.pillar}
                  onConfirm={(tasks) => {
                    onAddTasks && onAddTasks(tasks);
                    setMsgs(p=>[...p, { role:"user", text:"Sí, quiero programarlo", type:"text" }]);
                    setTimeout(()=>{
                      setMsgs(p=>[...p, { role:"assistant", text:`¡Perfecto! 🌱 "${m.suggest.title}" ya está en tu tab de Tareas. Cada día que lo completes estarás construyendo el hábito. ¿Hay algo más en lo que te pueda ayudar?`, type:"text" }]);
                    }, 400);
                  }}
                  onDecline={() => {
                    setMsgs(p=>[...p, { role:"user", text:"No por ahora", type:"text" }]);
                    setTimeout(()=>{
                      setMsgs(p=>[...p, { role:"assistant", text:"Entendido, sin presión 🌿 Cuando quieras retomarlo aquí estoy. ¿Qué más tienes en mente?", type:"text" }]);
                    }, 400);

            <div style={{width:28,height:28,borderRadius:"50%",flexShrink:0,background:`${T.forest}18`,border:`1px solid ${T.forest}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🌿</div>
            <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:"4px 16px 16px 16px",padding:"12px 16px",boxShadow:`0 2px 10px ${T.sand}33`}}>
              <div style={{display:"flex",gap:5,alignItems:"center",padding:"2px 0"}}>
                {[0,1,2].map(i=>(<div key={i} style={{width:7,height:7,borderRadius:"50%",background:T.forest,opacity:.4,animation:`bt-pulse 1.2s ease ${i*.2}s infinite`}}/>))}
              </div>
            </div>
          </div>

        <div ref={chatEndRef}/>

      {/* Quick prompts — vertical */}
      <div style={{padding:"8px 14px 6px",display:"flex",flexDirection:"column",gap:6,background:T.surface,borderTop:`1px solid ${T.border}`}}>
        {[
          `📅 Programa una actividad de ${selPillar?.name}`,
          "🎯 Dame un plan de 21 días",
          "🌿 Motivarme para empezar",
          "📊 ¿Cómo empiezo?",
        ].map((q,i)=>(
          <button key={i} onClick={()=>setInput(q.replace(/^[^\s]+\s/,""))}
            style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 14px",fontSize:12,color:T.muted,cursor:"pointer",textAlign:"left",fontFamily:T.body,fontWeight:300,transition:"all .2s",width:"100%"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=pillarData?.color||T.forest;e.currentTarget.style.color=pillarData?.color||T.forest;e.currentTarget.style.background=(pillarData?.colorDim||T.forest+"0a");}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.muted;e.currentTarget.style.background="transparent";}}
          >{q}</button>

      {/* Input */}
      <div style={{padding:"10px 14px 16px",display:"flex",gap:8,alignItems:"flex-end",background:T.surface}}>
        <textarea value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder={`Cuéntale a ARIA qué actividad de ${selPillar?.name} quieres programar…`}
          rows={1}
          style={{flex:1,background:T.card,border:`1.5px solid ${T.border}`,borderRadius:14,padding:"10px 14px",fontSize:13,color:T.ink,fontFamily:T.body,fontWeight:300,resize:"none",outline:"none",lineHeight:1.5,transition:"border-color .2s"}}
          onFocus={e=>e.target.style.borderColor=pillarData?.color||T.forest}
          onBlur={e=>e.target.style.borderColor=T.border}
        />
        <button onClick={send} disabled={!input.trim()||loading} className="bt-btn"
          style={{width:42,height:42,borderRadius:12,flexShrink:0,background:input.trim()&&!loading?`linear-gradient(135deg,${pillarData?.color||T.forest},${pillarData?.color||T.forest}bb)`:T.cardDark,border:`1px solid ${input.trim()?(pillarData?.color||T.forest)+"55":T.border}`,cursor:input.trim()&&!loading?"pointer":"not-allowed",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",color:input.trim()&&!loading?"#fff":T.muted,boxShadow:input.trim()&&!loading?`0 4px 16px ${(pillarData?.color||T.forest)}44`:"none"}}>↑</button>
      </div>
    </div>
  );
}

/* ── PROPÓSITOS CARD ─────────────────────────────────── */
function PropositosCard({ propositos, setPropositos, myPillars=[] }) {
  const [editing, setEditing]   = useState(null); // index being edited
  const [draft,   setDraft]     = useState("");
  const [adding,  setAdding]    = useState(false);
  const [newText, setNewText]   = useState("");

  const filled = (propositos||[]).filter(p=>p&&p.trim());

  function startEdit(i) {
    setEditing(i);
    setDraft(propositos[i]||"");
    setAdding(false);
  }

  function saveEdit(i) {
    const next = [...(propositos||[])];
    next[i] = draft.trim();
    setPropositos(next.filter(Boolean));
    setEditing(null);
  }

  function deleteProposito(i) {
    const next = (propositos||[]).filter((_,idx)=>idx!==i);
    setPropositos(next);
    setEditing(null);
  }

  function saveNew() {
    if (!newText.trim()) { setAdding(false); return; }
    setPropositos([...(propositos||[]), newText.trim()]);
    setNewText("");
    setAdding(false);
  }

  if (filled.length === 0 && !adding) return (
    <button onClick={()=>setAdding(true)}
      style={{background:"transparent",border:`1.5px dashed ${T.border}`,borderRadius:14,
        padding:"12px 16px",cursor:"pointer",fontFamily:T.body,width:"100%",
        display:"flex",alignItems:"center",gap:8,color:T.muted,fontSize:12}}>
      <span style={{fontSize:16}}>🧭</span>
      <span>Añade tu propósito de vida →</span>
    </button>
  );

  return (
    <div className="bt-rise" style={{
      background:`linear-gradient(135deg,${T.forest}08,${T.amber}05,${T.card})`,
      border:`1px solid ${T.forest}22`,borderRadius:16,padding:"16px 18px",
      animationDelay:".02s",
    }}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <span style={{fontSize:14}}>🧭</span>
          <span style={{fontFamily:T.display,fontSize:13,fontWeight:500,color:T.forest,letterSpacing:.5}}>
            Mi Propósito
          </span>
        </div>
        {!adding && (
          <button onClick={()=>{ setAdding(true); setEditing(null); }}
            style={{background:`${T.forest}12`,border:`1px solid ${T.forest}33`,
              borderRadius:8,padding:"4px 10px",fontSize:11,color:T.forest,
              cursor:"pointer",fontFamily:T.body,display:"flex",alignItems:"center",gap:4}}>
            + añadir
          </button>
        )}
      </div>

      {/* Propósitos list */}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filled.map((p,i)=>(
          <div key={i}>
            {editing === i ? (
              /* Edit mode */
              <div style={{background:T.surface,border:`1.5px solid ${T.forest}44`,
                borderRadius:11,padding:"12px 14px"}}>
                <div style={{fontSize:10,color:T.forest,fontFamily:T.display,fontStyle:"italic",marginBottom:6}}>
                  Propósito {i+1}
                </div>
                <textarea
                  value={draft}
                  onChange={e=>setDraft(e.target.value)}
                  rows={2}
                  autoFocus
                  style={{width:"100%",background:"transparent",border:"none",outline:"none",
                    fontFamily:T.display,fontSize:13,color:T.ink,lineHeight:1.7,
                    resize:"none",fontWeight:300}}
                />
                {/* Pillar chips in edit mode */}
                {myPillars.length>0 && (
                  <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10,color:T.muted,marginBottom:7}}>Pilares relacionados:</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {myPillars.map(pl=>(
                        <span key={pl.id} style={{
                          fontSize:10,padding:"3px 9px",borderRadius:20,
                          background:`${pl.color}18`,border:`1px solid ${pl.color}44`,
                          color:pl.color,fontFamily:T.body,
                        }}>{pl.icon} {pl.name}</span>
                      ))}
                    </div>
                  </div>
                )}
                <div style={{display:"flex",justifyContent:"space-between",marginTop:10}}>
                  <button onClick={()=>deleteProposito(i)}
                    style={{background:"transparent",border:`1px solid ${T.blush}66`,
                      borderRadius:7,padding:"5px 10px",fontSize:11,color:T.blush,
                      cursor:"pointer",fontFamily:T.body}}>
                    🗑 Eliminar
                  </button>
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>setEditing(null)}
                      style={{background:"transparent",border:`1px solid ${T.border}`,
                        borderRadius:7,padding:"5px 10px",fontSize:11,color:T.muted,
                        cursor:"pointer",fontFamily:T.body}}>
                      Cancelar
                    </button>
                    <button onClick={()=>saveEdit(i)}
                      style={{background:T.forest,border:"none",
                        borderRadius:7,padding:"5px 12px",fontSize:11,color:"#fff",
                        cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
                      Guardar
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* View mode */
              <div onClick={()=>startEdit(i)}
                style={{
                  display:"flex",flexDirection:"column",gap:8,
                  padding:"11px 13px",borderRadius:11,cursor:"pointer",
                  background: i===0 ? `${T.forest}06` : "transparent",
                  border:`1px solid ${i===0?T.forest+"22":T.border}`,
                  transition:"all .15s",
                }}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                  {/* Number badge */}
                  <div style={{
                    width:20,height:20,borderRadius:"50%",flexShrink:0,
                    background:i===0?T.forest:`${T.muted}22`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:10,color:i===0?"#fff":T.muted,fontWeight:"bold",marginTop:1,
                  }}>
                    {i+1}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{
                      fontFamily:T.display,fontSize:13,fontWeight:i===0?400:300,
                      color:i===0?T.ink:T.muted,lineHeight:1.65,fontStyle:"italic",
                    }}>
                      "{p}"
                    </div>
                  </div>
                  <span style={{fontSize:10,color:T.muted,flexShrink:0,marginTop:2}}>✏️</span>
                </div>
                {/* Pillar chips — always visible in view mode */}
                {myPillars.length>0 && (
                  <div style={{display:"flex",gap:5,flexWrap:"wrap",paddingLeft:30}}>
                    {myPillars.map(pl=>(
                      <span key={pl.id} style={{
                        fontSize:9,padding:"2px 8px",borderRadius:20,
                        background:`${pl.color}14`,border:`1px solid ${pl.color}33`,
                        color:pl.color,fontFamily:T.body,
                        display:"flex",alignItems:"center",gap:3,
                      }}>{pl.icon} {pl.name}</span>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        ))}

        {/* Add new */}
        {adding && (
          <div style={{background:T.surface,border:`1.5px solid ${T.forest}44`,
            borderRadius:11,padding:"10px 12px"}}>
            <div style={{fontSize:10,color:T.forest,marginBottom:6,fontFamily:T.display,fontStyle:"italic"}}>
              Propósito {filled.length+1}
            </div>
            <textarea
              value={newText}
              onChange={e=>setNewText(e.target.value)}
              placeholder="¿Para qué haces todo esto? Escríbelo con tus palabras..."
              rows={2}
              autoFocus
              style={{width:"100%",background:"transparent",border:"none",outline:"none",
                fontFamily:T.display,fontSize:13,color:T.ink,lineHeight:1.7,
                resize:"none",fontWeight:300,fontStyle:newText?"normal":"italic"}}
            />
            <div style={{display:"flex",justifyContent:"flex-end",gap:7,marginTop:8}}>
              <button onClick={()=>{ setAdding(false); setNewText(""); }}
                style={{background:"transparent",border:`1px solid ${T.border}`,
                  borderRadius:7,padding:"5px 10px",fontSize:11,color:T.muted,
                  cursor:"pointer",fontFamily:T.body}}>
                Cancelar
              </button>
              <button onClick={saveNew}
                disabled={!newText.trim()}
                style={{background:newText.trim()?T.forest:T.border,border:"none",
                  borderRadius:7,padding:"5px 12px",fontSize:11,color:"#fff",
                  cursor:newText.trim()?"pointer":"default",fontFamily:T.body,fontWeight:500,
                  transition:"background .2s"}}>
                Guardar
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── HABITS PANEL COMPONENT ─────────────────────────── */
function HabitsPanel({ pillar: p, tasks, setTasks }) {
  const [selHabits, setSelHabits] = useState(new Set());
  const [habitDate, setHabitDate] = useState(new Date().toISOString().slice(0,10));
  const [habitTime, setHabitTime] = useState("08:00");
  const [habitRepeat, setHabitRepeat] = useState(true);
  const [habitDurVal, setHabitDurVal] = useState(3);
  const [habitDurUnit, setHabitDurUnit] = useState("semanas");
  const [habitSaved, setHabitSaved] = useState(false);

  function toggleHabit(h) {
    setSelHabits(prev => {
      const next = new Set(prev);
      next.has(h) ? next.delete(h) : next.add(h);
      return next;
    });
    setHabitSaved(false);
  }

  function buildHabitTasks() {
    const list = [];
    const start = new Date(habitDate+"T12:00");
    const end = new Date(habitDate+"T12:00");
    if (habitRepeat) {
      if (habitDurUnit==="semanas") end.setDate(end.getDate()+habitDurVal*7-1);
      else end.setDate(end.getDate()+habitDurVal-1);
    }
    let idx=0;
    selHabits.forEach(h => {
      let d = new Date(start);
      while (d <= end) {
        list.push({
          id: Date.now()+idx++,
          pillarId: p.id,
          text: h,
          dueDate: d.toISOString().slice(0,10),
          time: habitTime,
          done: false, doneAt: null,
          recurring: habitRepeat,
        });
        d.setDate(d.getDate()+1);
      }
    });
    return list;
  }

  function handleAddHabits() {
    const newTasks = buildHabitTasks();
    newTasks.forEach(t => pendingSave.current.add(String(t.id)));
    setTasks(prev => [...prev, ...newTasks]);
    setHabitSaved(true);
    setSelHabits(new Set());
    setTimeout(()=>setHabitSaved(false), 3000);
  }

  const previewCount = buildHabitTasks().length;

  return (
    <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"16px 18px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontFamily:T.display,fontSize:12,color:T.muted,letterSpacing:2,textTransform:"uppercase"}}>Hábitos clave</div>
        {selHabits.size>0 && (
          <div style={{fontSize:11,color:p.color,fontWeight:500}}>{selHabits.size} seleccionado{selHabits.size!==1?"s":""}</div>
        )}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:selHabits.size>0?14:0}}>
        {p.keyHabits.map((h,i)=>{
          const sel = selHabits.has(h);
          const already = tasks.some(t=>t.pillarId===p.id&&t.text===h&&!t.done);
          return (
            <button key={i} onClick={()=>!already&&toggleHabit(h)}
              style={{
                background: sel?`${p.color}18`:already?`${T.forest}08`:"transparent",
                border: sel?`1.5px solid ${p.color}66`:already?`1px solid ${T.forest}33`:`1px solid ${T.border}`,
                borderRadius:11, padding:"10px 14px",
                cursor: already?"default":"pointer",
                fontFamily:T.body, textAlign:"left",
                display:"flex", alignItems:"center", gap:12,
                transition:"all .18s",
              }}>
              <div style={{
                width:20,height:20,borderRadius:6,flexShrink:0,
                background:sel?p.color:already?`${T.forest}22`:"transparent",
                border:`2px solid ${sel?p.color:already?T.forest+"44":T.border}`,
                display:"flex",alignItems:"center",justifyContent:"center",
                transition:"all .18s",
              }}>
                {sel && <span style={{color:"#fff",fontSize:11,fontWeight:"bold"}}>✓</span>}
                {already && <span style={{color:T.forest,fontSize:10}}>✓</span>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:sel?T.ink:T.muted,fontWeight:sel?400:300,lineHeight:1.4}}>{h}</div>
                {already && <div style={{fontSize:10,color:T.forest,marginTop:2}}>Ya en tus tareas</div>}
              </div>
              {!already && (
                <span style={{fontSize:10,color:sel?p.color:T.muted,flexShrink:0}}>
                  {sel?"✓ listo":"+ tarea"}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {selHabits.size > 0 && !habitSaved && (
        <div style={{background:`${p.color}08`,border:`1px solid ${p.color}33`,borderRadius:12,padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>

/* ── CALENDAR VIEW COMPONENT ─────────────────────────── */
function CalendarView({ tasks, myPillars, today, year, month, firstDay, daysInMonth, selDay, setSelDay, calMonth, setCalMonth }) {
  const [calPillarFilter, setCalPillarFilter] = useState("all");

  const calTasksByDate = {};
  tasks.forEach(t => {
    if (!t.dueDate) return;
    if (calPillarFilter !== "all" && t.pillarId !== calPillarFilter) return;
    (calTasksByDate[t.dueDate] = calTasksByDate[t.dueDate] || []).push(t);
  });

  function dayPillarDots(dateStr) {
    const dt = calTasksByDate[dateStr] || [];
    const seen = new Set();
    const dots = [];
    dt.forEach(t => {
      if (!seen.has(t.pillarId)) {
        seen.add(t.pillarId);
        const p = ALL_PILLARS.find(p=>p.id===t.pillarId);
        if (p) dots.push({ color: p.color, done: dt.filter(x=>x.pillarId===t.pillarId).every(x=>x.done) });
      }
    });
    return dots.slice(0,4);
  }

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>

      {/* Pillar filter chips */}
      <div style={{display:"flex",gap:6,overflowX:"auto",scrollbarWidth:"none",paddingBottom:2}}>
        <button onClick={()=>setCalPillarFilter("all")}
          style={{flexShrink:0,background:calPillarFilter==="all"?T.forest:"transparent",
            border:`1.5px solid ${calPillarFilter==="all"?T.forest:T.border}`,
            borderRadius:20,padding:"6px 14px",fontSize:11,
            color:calPillarFilter==="all"?"#fff":T.muted,cursor:"pointer",fontFamily:T.body,
            fontWeight:calPillarFilter==="all"?500:300,transition:"all .2s"}}>
          🗓️ Todos
        </button>
        {myPillars.map(p=>(
          <button key={p.id} onClick={()=>setCalPillarFilter(p.id)}
            style={{flexShrink:0,
              background:calPillarFilter===p.id?p.color:"transparent",
              border:`1.5px solid ${calPillarFilter===p.id?p.color:T.border}`,
              borderRadius:20,padding:"6px 12px",fontSize:11,
              color:calPillarFilter===p.id?"#fff":T.muted,
              cursor:"pointer",fontFamily:T.body,
              display:"flex",alignItems:"center",gap:4,transition:"all .2s"}}>
            <span>{p.icon}</span><span>{p.name}</span>
          </button>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <button onClick={()=>setCalMonth(new Date(year,month-1,1))}
            style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:T.muted,padding:"4px 10px"}}>‹</button>
          <div style={{fontFamily:T.display,fontSize:17,fontWeight:400,color:T.ink,textTransform:"capitalize"}}>
            {calMonth.toLocaleDateString("es",{month:"long",year:"numeric"})}
          </div>
          <button onClick={()=>setCalMonth(new Date(year,month+1,1))}
            style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:T.muted,padding:"4px 10px"}}>›</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:6}}>
          {["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map((d,i)=>(
            <div key={i} style={{textAlign:"center",fontSize:9,color:T.muted,fontWeight:500,letterSpacing:.5}}>{d}</div>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {Array.from({length:firstDay}).map((_,i)=><div key={"e"+i}/>)}
          {Array.from({length:daysInMonth}).map((_,i)=>{
            const d=i+1;
            const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
            const dt=calTasksByDate[dateStr]||[];
            const isToday=dateStr===today;
            const isSel=selDay===dateStr;
            const dots=dayPillarDots(dateStr);
            const allDone=dt.length>0&&dt.every(t=>t.done);
            return (
              <button key={d} onClick={()=>setSelDay(isSel?null:dateStr)}
                style={{borderRadius:10,padding:"4px 2px",textAlign:"center",minHeight:46,
                  background:isSel?`${T.forest}22`:isToday?`${T.forest}12`:dt.length>0?"#fff":"transparent",
                  border:isSel?`2px solid ${T.forest}`:isToday?`1.5px solid ${T.forest}44`:dt.length>0?`1px solid ${T.border}`:"1px solid transparent",
                  cursor:dt.length>0?"pointer":"default",transition:"all .15s",
                  display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",
                  paddingTop:6,gap:3,position:"relative"}}>
                {allDone && <div style={{position:"absolute",top:2,right:3,fontSize:8,color:T.forest}}>✓</div>}
                <span style={{fontSize:11,color:isSel||isToday?T.forest:T.ink,fontWeight:isSel||isToday?600:300,lineHeight:1}}>{d}</span>
                {dots.length>0 && (
                  <div style={{display:"flex",gap:2,flexWrap:"wrap",justifyContent:"center",maxWidth:28}}>
                    {dots.map((dot,di)=>(
                      <div key={di} style={{width:5,height:5,borderRadius:"50%",background:dot.color,opacity:dot.done?0.4:1}}/>
                    ))}
                  </div>
                )}
                {dt.length>0 && <div style={{fontSize:8,color:T.muted,lineHeight:1}}>{dt.length}</div>}
              </button>
            );
          })}
        </div>

        <div style={{marginTop:12,paddingTop:10,borderTop:`1px solid ${T.border}`}}>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
            {myPillars.filter(p=>tasks.some(t=>t.pillarId===p.id&&t.dueDate)).map(p=>(
              <div key={p.id} style={{display:"flex",gap:4,alignItems:"center"}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:p.color}}/>
                <span style={{fontSize:9,color:T.muted}}>{p.icon} {p.name}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Day detail panel */}
      {selDay && (
        <DayDetail
          selDay={selDay}
          calTasksByDate={calTasksByDate}
        />
      )}
    </div>
  );
}

function DayDetail({ selDay, calTasksByDate }) {
  const dayTasks = calTasksByDate[selDay] || [];
  const grouped = {};
  dayTasks.forEach(t => {
    (grouped[t.pillarId] = grouped[t.pillarId] || []).push(t);
  });

  return (
    <div style={{background:T.card,border:`1.5px solid ${T.forest}33`,borderRadius:16,padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontFamily:T.display,fontSize:15,color:T.forest,fontWeight:400,textTransform:"capitalize"}}>
          📅 {new Date(selDay+"T12:00").toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}
        </div>
        {dayTasks.length>0 && (
          <div style={{fontSize:11,color:T.muted}}>
            {dayTasks.filter(t=>t.done).length}/{dayTasks.length} hechas
          </div>
        )}
      </div>
      {dayTasks.length===0 ? (
        <div style={{fontSize:12,color:T.muted,fontStyle:"italic",textAlign:"center",padding:"16px 0"}}>
          Sin tareas este día
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {Object.entries(grouped).map(([pid, ptasks])=>{
            const p = ALL_PILLARS.find(x=>x.id===pid);
            const doneCount = ptasks.filter(t=>t.done).length;
            return (
              <div key={pid}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                  marginBottom:6,paddingBottom:6,borderBottom:`1px solid ${p?.color||T.forest}22`}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:p?.color||T.forest}}/>
                    <span style={{fontSize:12,color:p?.color||T.forest,fontWeight:500}}>{p?.icon} {p?.name}</span>
                  </div>
                  <span style={{fontSize:11,color:T.muted}}>{doneCount}/{ptasks.length}</span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {ptasks.map(task=>(
                    task.done
                      ? <DoneRow key={task.id} task={task}/>
                      : <TaskRow key={task.id} task={task}/>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MainApp({ activePillarIds, userName, birthdate, gender, pillarProfiles, propositos=[], onPropositosChange=null, initialTasks=[], session=null, onSignOut=null }) {
  const [tab, setTab]         = useState("home");
  const [detail, setDetail]   = useState(null);
  const [demoProgress, setDemoProgress] = useState(0);
  const [showPillarEdit, setShowPillarEdit] = useState(false);
  // Tasks state
  const [tasks, setTasks]     = useState(initialTasks);
  // Local propositos state — syncs up to App via callback
  const [localPropositos, setLocalPropositos] = useState(propositos);
  function handlePropositosChange(val) {
    setLocalPropositos(val);
    if (onPropositosChange) onPropositosChange(val);
  }
  const [notifGranted, setNotifGranted] = useState(typeof Notification !== "undefined" && Notification.permission === "granted");

  // Track which task ids need saving
  const pendingSave = React.useRef(new Set());

  // Persist tasks — only save tasks that changed
  useEffect(() => {
    if (!session?.access_token || !session?.user?.id) return;
    // Mark all current tasks as pending on first load is wrong — 
    // we only mark tasks modified by user actions (addTask, toggleTask, editTask)
    const timer = setTimeout(async () => {
      const toSave = [...pendingSave.current];
      if (toSave.length === 0) return;
      pendingSave.current.clear();
      try {
        for (const id of toSave) {
          const task = tasks.find(t => String(t.id) === String(id));
          if (task) await supa.upsertTask(session.access_token, session.user.id, task);
        }
      } catch(e) { console.error("Task save error:", e); }
    }, 800);
    return () => clearTimeout(timer);
  }, [tasks]);

  function addTask(pillarId, text, dueDate, time) {
    const task = { id: Date.now(), pillarId, text, dueDate, time, done: false, createdAt: new Date().toISOString() };
    pendingSave.current.add(String(task.id));
    setTasks(p => [...p, task]);
    if (notifGranted && time && dueDate) scheduleNotif(task);
    return task;
  }
  function toggleTask(id) {
    pendingSave.current.add(String(id));
    setTasks(p => p.map(t => t.id === id ? { ...t, done: !t.done, doneAt: !t.done ? new Date().toISOString() : null } : t));
  }
  function deleteTask(id) {
    setTasks(p => p.filter(t => t.id !== id));
    if (session?.access_token) {
      supa.deleteSingleTask(session.access_token, String(id)).catch(()=>{});
    }
  }
  function editTask(id, changes) {
    pendingSave.current.add(String(id));
    setTasks(p => p.map(t => t.id===id ? {...t,...changes} : t));
  }

  function scheduleNotif(task) {
    if (!("serviceWorker" in navigator) || !notifGranted) return;
    // Show notification via SW if available, else use Notification API directly
    try {
      new Notification(`🌿 Grow — ${task.text}`, {
        body: "Es hora de tu actividad programada",
        icon: "/icons/icon-192.png",
      });
    } catch {}
  }

  async function requestNotifPermission() {
    if (!("Notification" in window)) return;
    const perm = await Notification.requestPermission();
    setNotifGranted(perm === "granted");
  }
  // Community state
  const [commView,    setCommView]    = useState("home");
  const [activeGroup, setActiveGroup] = useState(null);
  const [commFilter,  setCommFilter]  = useState("todos");
  const [grpJoined,   setGrpJoined]   = useState({fundamentos:true,nutricion:true});
  const [chJoined,    setChJoined]    = useState({c1:true,c2:true});
  const [buddyReq,    setBuddyReq]    = useState({});
  const [newPost,     setNewPost]     = useState("");
  const [extraPosts,  setExtraPosts]  = useState({});
  // AriaChat state managed inside AriaChat component (defined outside MainApp)

  const myPillars = ALL_PILLARS.filter(p=>activePillarIds.includes(p.id));
  const overallReal = myPillars.length ? Math.round(myPillars.reduce((s,p)=>s+p.progress,0)/myPillars.length) : 0;
  // Boost progress from completed tasks (each completed task = +0.5% up to +20%)
  const taskBoost = Math.min(20, tasks.filter(t=>t.done).length * 0.5);
  const overall   = demoProgress > 0 ? demoProgress : Math.min(100, Math.round(overallReal + taskBoost));

  // Stable strings for AriaChat — computed once with useMemo so AriaChat never remounts

  , []); // eslint-disable-line

  const ariaInitialMsg = React.useMemo(() =>
    `Hola${userName?`, ${userName}`:""}. Soy ARIA, el alma de Grow 🌿\n\n${propositos.length>0?`Ya leí tus propósitos. "${propositos[0]}" — eso me dice mucho sobre a dónde quieres llegar.\n\n`:""}Tus ${activePillarIds.length} pilares están listos para florecer, con los Fundamentos como raíz de todo.\n\n¿Por dónde quieres empezar hoy?`
  , []); // eslint-disable-line



  /* ── HOME ──────────────────────────────────────────────────── */

  /* ── DETAIL ─────────────────────────────────────────────────── */
  const DetailTab = ()=>{
    const p = detail;
    if(!p) return null;

    // Real data from tasks
    const pillarTasks    = tasks.filter(t => t.pillarId === p.id);
    const doneTasks      = pillarTasks.filter(t => t.done);
    const pendingTasks   = pillarTasks.filter(t => !t.done);
    const todayStr       = new Date().toISOString().slice(0,10);
    const todayTasks     = pendingTasks.filter(t => t.dueDate === todayStr);
    const upcomingTasks  = pendingTasks.filter(t => t.dueDate && t.dueDate > todayStr)
                            .sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);

    // Real progress %
    const realProgress = pillarTasks.length > 0
      ? Math.round(doneTasks.length / pillarTasks.length * 100) : 0;

    // Streak for this pillar — consecutive days with at least one done task
    const pillarStreak = (() => {
      const doneDays = new Set(doneTasks.filter(t=>t.doneAt).map(t=>t.doneAt.slice(0,10)));
      let streak = 0;
      const d = new Date();
      while (doneDays.has(d.toISOString().slice(0,10))) {
        streak++;
        d.setDate(d.getDate()-1);
      }
      return streak;
    })();

    // Best streak ever
    const bestStreak = (() => {
      const days = [...new Set(doneTasks.filter(t=>t.doneAt).map(t=>t.doneAt.slice(0,10)))].sort();
      let best=0, cur=0, prev=null;
      days.forEach(day => {
        if (prev) {
          const diff = (new Date(day) - new Date(prev)) / 86400000;
          cur = diff === 1 ? cur+1 : 1;
        } else { cur=1; }
        if (cur>best) best=cur;
        prev=day;
      });
      return best;
    })();

    // Achievements
    const achievements = [];
    if (doneTasks.length >= 1)  achievements.push({icon:"🌱", label:"Primera tarea", desc:"Completaste tu primera tarea"});
    if (doneTasks.length >= 7)  achievements.push({icon:"✨", label:"7 tareas", desc:"Una semana de acción"});
    if (doneTasks.length >= 21) achievements.push({icon:"🌿", label:"21 tareas", desc:"Hábito en formación"});
    if (doneTasks.length >= 50) achievements.push({icon:"🌳", label:"50 tareas", desc:"Árbol en crecimiento"});
    if (pillarStreak >= 3)      achievements.push({icon:"🔥", label:"Racha de 3 días", desc:"3 días consecutivos"});
    if (pillarStreak >= 7)      achievements.push({icon:"💫", label:"Racha de 7 días", desc:"Una semana imparable"});
    if (bestStreak >= 14)       achievements.push({icon:"🏆", label:"14 días seguidos", desc:"Campeón de constancia"});
    if (realProgress >= 25)     achievements.push({icon:"🥉", label:"25% completado", desc:"Un cuarto del camino"});
    if (realProgress >= 50)     achievements.push({icon:"🥈", label:"Mitad del camino", desc:"50% completado"});
    if (realProgress >= 100)    achievements.push({icon:"🥇", label:"¡Pilar completado!", desc:"¡Todas las tareas hechas!"});

    return (
      <div style={{padding:"18px 16px 100px",display:"flex",flexDirection:"column",gap:16}}>

        {/* Back */}
        <button onClick={()=>setTab("home")}
          style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,
            padding:"6px 14px",fontSize:11,color:T.muted,cursor:"pointer",
            fontFamily:T.body,alignSelf:"flex-start",display:"flex",alignItems:"center",gap:5}}>
          ← Inicio
        </button>

        {/* Hero con progreso real */}
        <div className="bt-bloom" style={{
          background:`linear-gradient(135deg,${p.color}12,${T.card})`,
          border:`1px solid ${p.color}44`,borderRadius:20,padding:"22px",
          boxShadow:`0 4px 24px ${p.color}14`,
        }}>
          <div style={{display:"flex",gap:16,alignItems:"center",marginBottom:16}}>
            <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <Ring pct={realProgress||2} color={p.color} size={76} stroke={5} bg={T.border}/>
              <span style={{position:"absolute",fontSize:28}}>{p.icon}</span>
            </div>
            <div style={{flex:1}}>
              <div style={{fontFamily:T.display,fontSize:22,fontWeight:500,color:T.ink,marginBottom:3}}>{p.name}</div>
              <div style={{fontSize:12,color:T.muted,fontStyle:"italic",fontFamily:T.display,marginBottom:10}}>{p.quote}</div>
              {/* Stats row */}
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <div style={{background:`${p.color}18`,borderRadius:8,padding:"5px 10px",textAlign:"center"}}>
                  <div style={{fontFamily:T.mono,fontSize:18,fontWeight:"bold",color:p.color,lineHeight:1}}>{realProgress}%</div>
                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>progreso</div>

                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>racha actual</div>
                </div>
                <div style={{background:`${T.forest}10`,borderRadius:8,padding:"5px 10px",textAlign:"center"}}>
                  <div style={{fontFamily:T.mono,fontSize:18,fontWeight:"bold",color:T.forest,lineHeight:1}}>{doneTasks.length}</div>
                  <div style={{fontSize:9,color:T.muted,marginTop:2}}>completadas</div>
                </div>
              </div>
            </div>
          </div>

          {/* Progress bar */}
          <div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:11,color:T.muted}}>{doneTasks.length} de {pillarTasks.length} tareas completadas</span>
              <span style={{fontSize:11,color:p.color,fontWeight:500}}>{realProgress}%</span>
            </div>
            <div style={{height:8,background:T.border,borderRadius:4,overflow:"hidden"}}>
              <div style={{height:"100%",borderRadius:4,
                background:`linear-gradient(90deg,${p.color},${p.color}99)`,
                width:`${realProgress}%`,transition:"width .8s ease"}}/>
            </div>
          </div>
        </div>

        {/* Tareas de HOY */}
        {todayTasks.length > 0 && (
          <div style={{background:T.card,border:`1.5px solid ${p.color}44`,borderRadius:16,padding:"14px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,color:p.color,letterSpacing:2,textTransform:"uppercase",fontWeight:500}}>📅 Hoy</div>
              <div style={{fontSize:11,color:T.muted}}>{todayTasks.length} pendiente{todayTasks.length!==1?"s":""}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {todayTasks.map(task=>(
                <button key={task.id}
                  onClick={()=>{ setTab("tasks"); }}
                  style={{background:`${p.color}08`,border:`1px solid ${p.color}33`,
                    borderRadius:11,padding:"10px 14px",cursor:"pointer",
                    fontFamily:T.body,textAlign:"left",
                    display:"flex",alignItems:"center",gap:10,transition:"all .15s"}}>
                  <div style={{width:10,height:10,borderRadius:3,border:`2px solid ${p.color}88`,flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,color:T.ink,fontWeight:300}}>{task.text}</div>
                    {task.time && <div style={{fontSize:10,color:T.muted,marginTop:2}}>🕐 {task.time}</div>}
                  </div>
                  <span style={{fontSize:10,color:T.muted}}>→</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Próximas tareas */}
        {upcomingTasks.length > 0 && (
          <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"14px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,color:T.muted,letterSpacing:2,textTransform:"uppercase"}}>Próximas</div>
              <button onClick={()=>setTab("tasks")}
                style={{background:"none",border:"none",fontSize:11,color:p.color,cursor:"pointer",fontFamily:T.body}}>
                Ver todas →
              </button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {upcomingTasks.map(task=>(
                <button key={task.id} onClick={()=>setTab("tasks")}
                  style={{background:"transparent",border:`1px solid ${T.border}`,
                    borderRadius:10,padding:"9px 12px",cursor:"pointer",
                    fontFamily:T.body,textAlign:"left",
                    display:"flex",alignItems:"center",gap:10,transition:"all .15s"}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:p.color,flexShrink:0,opacity:.6}}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,color:T.ink,fontWeight:300}}>{task.text}</div>
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>
                      📅 {new Date(task.dueDate+"T12:00").toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})}
                      {task.time && ` · 🕐 ${task.time}`}
                    </div>
                  </div>
                  <span style={{fontSize:10,color:T.muted}}>→</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Sin tareas CTA */}
        {pillarTasks.length === 0 && (
          <div style={{background:`${p.color}08`,border:`1.5px dashed ${p.color}44`,
            borderRadius:16,padding:"20px",textAlign:"center"}}>
            <div style={{fontSize:32,marginBottom:8}}>{p.icon}</div>
            <div style={{fontFamily:T.display,fontSize:15,color:T.ink,fontStyle:"italic",marginBottom:4}}>
              Sin tareas aún para {p.name}
            </div>
            <div style={{fontSize:12,color:T.muted,marginBottom:14}}>Agrega actividades para ver tu progreso real</div>
            <button onClick={()=>setTab("tasks")}
              style={{background:`linear-gradient(135deg,${p.color},${p.color}cc)`,
                border:"none",borderRadius:12,padding:"11px 22px",
                fontSize:13,color:"#fff",cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
              + Agregar tareas →
            </button>
          </div>
        )}

        {/* Logros */}
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:16,padding:"14px 16px"}}>
          <div style={{fontSize:11,color:T.muted,letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>🏆 Logros</div>
          {achievements.length === 0 ? (
            <div style={{fontSize:12,color:T.muted,fontStyle:"italic",textAlign:"center",padding:"8px 0"}}>
              Completa tareas para desbloquear logros 🌱
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {achievements.map((a,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:12,
                  background:`${p.color}08`,borderRadius:10,padding:"10px 12px",
                  border:`1px solid ${p.color}22`}}>
                  <span style={{fontSize:22,flexShrink:0}}>{a.icon}</span>
                  <div>
                    <div style={{fontSize:13,color:T.ink,fontWeight:500}}>{a.label}</div>
                    <div style={{fontSize:11,color:T.muted,marginTop:1}}>{a.desc}</div>

              ))}
              {/* Locked next achievement */}
              {(() => {
                const MILESTONES = [
                  {need: doneTasks.length < 1,  icon:"🌱", label:"Primera tarea"},
                  {need: doneTasks.length < 7,  icon:"✨", label:"7 tareas completadas"},
                  {need: doneTasks.length < 21, icon:"🌿", label:"21 tareas"},
                  {need: doneTasks.length < 50, icon:"🌳", label:"50 tareas"},
                  {need: pillarStreak < 3,       icon:"🔥", label:"Racha de 3 días"},
                  {need: pillarStreak < 7,       icon:"💫", label:"Racha de 7 días"},
                  {need: realProgress < 25,      icon:"🥉", label:"25% progreso"},
                  {need: realProgress < 50,      icon:"🥈", label:"50% progreso"},
                  {need: realProgress < 100,     icon:"🥇", label:"Completar el pilar"},
                ];
                const next = MILESTONES.find(m=>m.need);
                if (!next) return null;
                return (
                  <div style={{display:"flex",alignItems:"center",gap:12,
                    background:T.border+"44",borderRadius:10,padding:"10px 12px",
                    border:`1px dashed ${T.border}`,opacity:.6}}>
                    <span style={{fontSize:22,filter:"grayscale(1)",flexShrink:0}}>{next.icon}</span>
                    <div>
                      <div style={{fontSize:12,color:T.muted}}>🔒 {next.label}</div>
                      <div style={{fontSize:10,color:T.muted,marginTop:1}}>Próximo logro por desbloquear</div>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
