html,body{height:100%;overflow:hidden;background:#EDE8E0}

@keyframes bt-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes bt-rise2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bt-bloom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes bt-breathe{0%,100%{box-shadow:0 0 0 0 #3D6B4F22}50%{box-shadow:0 0 0 10px #3D6B4F00}}
@keyframes bt-leaf{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
@keyframes bt-sprout{from{transform-origin:bottom center;transform:scaleY(0);opacity:0}to{transform-origin:bottom center;transform:scaleY(1);opacity:1}}
@keyframes bt-unfurl{from{transform-origin:left bottom;transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes bt-unfurl-r{from{transform-origin:right bottom;transform:scale(0) rotate(20deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes bt-blossom{0%{transform:scale(0) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(2deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes bt-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes splash-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bt-rise{animation:bt-rise .55s cubic-bezier(.22,1,.36,1) both}.bt-rise2{animation:bt-rise2 .4s ease both}.bt-bloom{animation:bt-bloom .45s cubic-bezier(.22,1,.36,1) both}
.bt-plant-stem{animation:bt-sprout .8s cubic-bezier(.22,1,.36,1) both}.bt-plant-leaf1{animation:bt-unfurl .6s cubic-bezier(.22,1,.36,1) .5s both}.bt-plant-leaf2{animation:bt-unfurl-r .6s cubic-bezier(.22,1,.36,1) .7s both}.bt-plant-leaf3{animation:bt-unfurl .5s cubic-bezier(.22,1,.36,1) .9s both}.bt-plant-leaf4{animation:bt-unfurl-r .5s cubic-bezier(.22,1,.36,1) 1.0s both}.bt-plant-flower{animation:bt-blossom .7s cubic-bezier(.22,1,.36,1) 1.2s both}.bt-plant-float{animation:bt-float 3.5s ease-in-out infinite}
.bt-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px #D4C4A888;transition:all .25s ease}.bt-btn{transition:all .2s ease}.bt-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
#splash{position:fixed;inset:0;background:#F7F3ED;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .6s ease}
#splash.fade{opacity:0;pointer-events:none}
#splash-icon{width:88px;height:88px;border-radius:28px;background:linear-gradient(145deg,#3D6B4F22,#C8872A22);border:1.5px solid #E8DDD0;display:flex;align-items:center;justify-content:center;font-size:42px;animation:splash-breathe 3s ease infinite}
#splash-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:52px;font-weight:300;letter-spacing:-2px;color:#3D6B4F;line-height:1}
#splash-sub{font-family:"DM Sans",sans-serif;font-size:12px;color:#8C7B68;font-weight:300;letter-spacing:2px;text-transform:uppercase}
#install-banner{position:fixed;bottom:0;left:0;right:0;background:#3D6B4F;color:#fff;padding:14px 20px 24px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:1000;border-radius:20px 20px 0 0;font-family:"DM Sans",sans-serif}
#install-banner.show{display:flex;animation:slideUp .4s ease}
#install-btn{background:#F7F3ED;color:#3D6B4F;border:none;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
#dismiss-btn{background:transparent;color:#F7F3ED88;border:none;font-size:22px;cursor:pointer;padding:4px;flex-shrink:0}</style>

const { useState, useRef, useEffect } = React;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e.message }; }
  render() {
    if (this.state.error) return (
      <div style={{padding:32,fontFamily:"DM Sans,sans-serif",color:"#2C2416",background:"#F7F3ED",minHeight:"100vh"}}>
        <div style={{fontSize:24,marginBottom:8}}>🌱</div>
        <div style={{fontSize:16,fontWeight:500,marginBottom:8}}>Grow · Error</div>
        <div style={{fontSize:12,color:"#8C7B68",background:"#fff",padding:12,borderRadius:8,wordBreak:"break-all"}}>{this.state.error}</div>
        <button onClick={()=>window.location.reload()} style={{marginTop:16,padding:"10px 20px",background:"#3D6B4F",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontSize:14}}>Recargar</button>
      </div>
    );
    return this.props.children;
  }
}

/* ─── Ring SVG ──────────────────────────────────────────────── */
function Ring({ pct, color, size=52, stroke=3.5, bg=T.border }) {
  const r = (size - stroke*2)/2;
  const c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={`${(pct/100)*c} ${c}`} strokeLinecap="round"
        style={{transition:"stroke-dasharray 1.1s cubic-bezier(.22,1,.36,1)"}}/>
    </svg>
  );
}


/* ═══════════════════════════════════════════════════════════════
   GROWING PLANT — El logo vivo que crece con el progreso
   ─────────────────────────────────────────────────────────────
   6 etapas de crecimiento basadas en progreso global (0–100%):
   0  Semilla          (0%)
   1  Brote inicial    (1–15%)
   2  Tallo con hoja   (16–35%)
   3  Planta joven     (36–55%)
   4  Planta madura    (56–79%)
   5  Planta plena     (80–100%)
   ═══════════════════════════════════════════════════════════════ */
function GrowingPlant({ overall=0, size=180, animated=true }) {
  const { useState: _u, useEffect: _e } = { useState, useEffect };
  
  // Determine growth stage
  const stage = overall >= 90 ? 6
              : overall >= 75 ? 5
              : overall >= 60 ? 4
              : overall >= 40 ? 3
              : overall >= 25 ? 2
              : overall >= 10 ? 1
              : 0;

  const STAGES = [
    "Semilla",
    "Primer brote",
    "Plántula",
    "Planta joven",
    "Planta madura",
    "En flor",
    "¡Florecida!"
  ];

  const stageColor = [T.sand, T.sage, T.moss, T.moss, T.forest, T.forest, T.amber];
  const cx = size / 2;
  const groundY = size * 0.82;
  const potH = size * 0.18;

  // Stem height grows with stage
  const stemHeights = [0, size*0.18, size*0.34, size*0.46, size*0.52, size*0.58, size*0.60];
  const stemH = stemHeights[Math.min(stage, 6)];
  const stemTop = groundY - stemH;
  const stemW = Math.max(1.5, 2.5 + stage * 0.4);

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
      <svg
        width={size} height={size}
        viewBox={`0 0 ${size} ${size}`}
        style={{overflow:"visible", filter:"drop-shadow(0 4px 16px rgba(61,107,79,.12))"}}
      >
        {/* ── Pot ── */}
        <g>
          {/* Pot body */}
          <path
            d={`M ${cx-size*.14} ${groundY+size*.03} 
                L ${cx-size*.1} ${groundY+potH} 
                L ${cx+size*.1} ${groundY+potH} 
                L ${cx+size*.14} ${groundY+size*.03} Z`}
            fill={T.terra} opacity="0.75"
          />
          {/* Pot rim */}
          <rect
            x={cx-size*.16} y={groundY}
            width={size*.32} height={size*.04}
            rx={size*.01}
            fill={T.blush} opacity="0.6"
          />
          {/* Soil */}
          <ellipse
            cx={cx} cy={groundY+size*.02}
            rx={size*.13} ry={size*.025}
            fill={T.ink} opacity="0.4"
          />
          {/* Soil texture dots */}
          {stage > 0 && [-.06,0,.06].map((dx,i) => (
            <circle key={i} cx={cx+size*dx} cy={groundY+size*.02}
              r={size*.009} fill={T.ink} opacity="0.25"/>
          ))}
        </g>

        {/* ── Stage 0: Seed ── */}
        {stage === 0 && (
          <g>
            <ellipse cx={cx} cy={groundY+size*.01} rx={size*.025} ry={size*.018}
              fill={T.amber} opacity="0.8"
              style={{animation:"bt-blossom .6s ease both"}}
            />
            <ellipse cx={cx} cy={groundY} rx={size*.01} ry={size*.008}
              fill={T.amber} opacity="0.5"/>
          </g>
        )}

        {/* ── Stem (stages 1+) ── */}
        {stage >= 1 && (
          <g className={animated ? "bt-plant-stem" : ""}>
            <path
              d={`M ${cx} ${groundY} 
                  Q ${cx + size*.02} ${groundY - stemH*.5} 
                    ${cx} ${stemTop}`}
              stroke={T.forest} strokeWidth={stemW}
              fill="none" strokeLinecap="round"
            />
          </g>
        )}

        {/* ── Stage 1: Cotyledons (seed leaves) ── */}
        {stage >= 1 && (
          <g className={animated ? "bt-plant-leaf1" : ""} style={{transformOrigin:`${cx}px ${groundY - stemH*.4}px`}}>
            <ellipse cx={cx - size*.05} cy={groundY - stemH*.45}
              rx={size*.055} ry={size*.03}
              fill={T.sage} opacity="0.9"
              style={{transform:"rotate(-25deg)", transformOrigin:`${cx - size*.05}px ${groundY - stemH*.45}px`}}
            />
          </g>
        )}
        {stage >= 1 && (
          <g className={animated ? "bt-plant-leaf2" : ""} style={{transformOrigin:`${cx}px ${groundY - stemH*.4}px`}}>
            <ellipse cx={cx + size*.05} cy={groundY - stemH*.42}
              rx={size*.055} ry={size*.03}
              fill={T.sage} opacity="0.85"
              style={{transform:"rotate(25deg)", transformOrigin:`${cx + size*.05}px ${groundY - stemH*.42}px`}}
            />
          </g>
        )}

        {/* ── Stage 2+: First true leaves ── */}
        {stage >= 2 && (
          <g className={animated ? "bt-plant-leaf1" : ""}>
            {/* Left leaf */}
            <path
              d={`M ${cx} ${groundY - stemH*.55}
                  Q ${cx - size*.14} ${groundY - stemH*.65}
                    ${cx - size*.16} ${groundY - stemH*.8}
                  Q ${cx - size*.04} ${groundY - stemH*.72}
                    ${cx} ${groundY - stemH*.55}`}
              fill={T.moss} opacity="0.88"
            />
            <path
              d={`M ${cx} ${groundY - stemH*.55} L ${cx - size*.16} ${groundY - stemH*.8}`}
              stroke={T.forest} strokeWidth="0.8" opacity="0.4" fill="none"
            />
          </g>
        )}
        {stage >= 2 && (
          <g className={animated ? "bt-plant-leaf2" : ""}>
            {/* Right leaf */}
            <path
              d={`M ${cx} ${groundY - stemH*.52}
                  Q ${cx + size*.14} ${groundY - stemH*.62}
                    ${cx + size*.15} ${groundY - stemH*.77}
                  Q ${cx + size*.04} ${groundY - stemH*.69}
                    ${cx} ${groundY - stemH*.52}`}
              fill={T.moss} opacity="0.82"
            />
            <path
              d={`M ${cx} ${groundY - stemH*.52} L ${cx + size*.15} ${groundY - stemH*.77}`}
              stroke={T.forest} strokeWidth="0.8" opacity="0.4" fill="none"
            />
          </g>
        )}

        {/* ── Stage 3+: Second pair of leaves (bigger) ── */}
        {stage >= 3 && (
          <g className={animated ? "bt-plant-leaf3" : ""}>
            <path
              d={`M ${cx} ${groundY - stemH*.72}
                  Q ${cx - size*.18} ${groundY - stemH*.8}
                    ${cx - size*.2} ${groundY - stemH*.96}
                  Q ${cx - size*.05} ${groundY - stemH*.89}
                    ${cx} ${groundY - stemH*.72}`}
              fill={T.forest} opacity="0.85"
            />
            <path
              d={`M ${cx} ${groundY - stemH*.72} L ${cx - size*.2} ${groundY - stemH*.96}`}
              stroke={T.forest} strokeWidth="0.7" opacity="0.35" fill="none"
            />
          </g>
        )}
        {stage >= 3 && (
          <g className={animated ? "bt-plant-leaf4" : ""}>
            <path
              d={`M ${cx} ${groundY - stemH*.69}
                  Q ${cx + size*.18} ${groundY - stemH*.78}
                    ${cx + size*.19} ${groundY - stemH*.94}
                  Q ${cx + size*.04} ${groundY - stemH*.87}
                    ${cx} ${groundY - stemH*.69}`}
              fill={T.forest} opacity="0.8"
            />
            <path
              d={`M ${cx} ${groundY - stemH*.69} L ${cx + size*.19} ${groundY - stemH*.94}`}
              stroke={T.forest} strokeWidth="0.7" opacity="0.35" fill="none"
            />
          </g>
        )}

        {/* ── Stage 4+: Crown leaves ── */}
        {stage >= 4 && (
          <g className={animated ? "bt-plant-leaf1" : ""} style={{animationDelay:"0s"}}>
            <path
              d={`M ${cx} ${stemTop + size*.04}
                  Q ${cx - size*.13} ${stemTop - size*.05}
                    ${cx - size*.08} ${stemTop - size*.16}
                  Q ${cx + size*.01} ${stemTop - size*.06}
                    ${cx} ${stemTop + size*.04}`}
              fill={T.forest} opacity="0.9"
            />
          </g>
        )}
        {stage >= 4 && (
          <g className={animated ? "bt-plant-leaf2" : ""} style={{animationDelay:".1s"}}>
            <path
              d={`M ${cx} ${stemTop + size*.02}
                  Q ${cx + size*.13} ${stemTop - size*.04}
                    ${cx + size*.09} ${stemTop - size*.15}
                  Q ${cx - size*.01} ${stemTop - size*.06}
                    ${cx} ${stemTop + size*.02}`}
              fill={T.moss} opacity="0.88"
            />
          </g>
        )}

        {/* ── Stage 5+: Flower bud ── */}
        {stage >= 5 && (
          <g className={animated ? "bt-plant-flower bt-plant-float" : "bt-plant-float"}
             style={{transformOrigin:`${cx}px ${stemTop - size*.06}px`}}>
            {/* Sepals */}
            {[0,72,144,216,288].map((deg,i) => (
              <ellipse key={i}
                cx={cx + size*.028 * Math.cos((deg-90)*Math.PI/180)}
                cy={(stemTop - size*.06) + size*.028 * Math.sin((deg-90)*Math.PI/180)}
                rx={size*.035} ry={size*.016}
                fill={T.forest} opacity="0.7"
                style={{
                  transform:`rotate(${deg}deg)`,
                  transformOrigin:`${cx + size*.028 * Math.cos((deg-90)*Math.PI/180)}px ${(stemTop-size*.06) + size*.028*Math.sin((deg-90)*Math.PI/180)}px`
                }}
              />
            ))}
            {/* Bud center */}
            <circle cx={cx} cy={stemTop - size*.06}
              r={size*.04}
              fill={T.amber} opacity="0.85"
            />
            <circle cx={cx} cy={stemTop - size*.06}
              r={size*.022}
              fill={T.sand} opacity="0.9"
            />
          </g>
        )}

        {/* ── Stage 6: Full flower open ── */}
        {stage >= 6 && (
          <g className={animated ? "bt-plant-flower bt-plant-float" : "bt-plant-float"}
             style={{transformOrigin:`${cx}px ${stemTop - size*.06}px`}}>
            {/* Petals */}
            {[0,60,120,180,240,300].map((deg,i) => (
              <ellipse key={i}
                cx={cx + size*.07 * Math.cos((deg-90)*Math.PI/180)}
                cy={(stemTop - size*.06) + size*.07 * Math.sin((deg-90)*Math.PI/180)}
                rx={size*.055} ry={size*.03}
                fill={i%2===0 ? T.amber : T.blush} opacity="0.85"
                style={{
                  transform:`rotate(${deg}deg)`,
                  transformOrigin:`${cx + size*.07*Math.cos((deg-90)*Math.PI/180)}px ${(stemTop-size*.06)+size*.07*Math.sin((deg-90)*Math.PI/180)}px`
                }}
              />
            ))}
            {/* Stamen center */}
            <circle cx={cx} cy={stemTop - size*.06}
              r={size*.038}
              fill={T.amber} opacity="0.95"
            />
            <circle cx={cx} cy={stemTop - size*.06}
              r={size*.02}
              fill={T.sand} opacity="1"
            />
            {/* Sparkles around flower */}
            {[45,135,225,315].map((deg,i) => (
              <text key={i}
                x={cx + size*.13 * Math.cos((deg-90)*Math.PI/180) - 4}
                y={(stemTop - size*.06) + size*.13 * Math.sin((deg-90)*Math.PI/180) + 4}
                fontSize={size*.055} opacity="0.7"
                style={{animation:`bt-pulse 2s ease ${i*.3}s infinite`}}
              >✦</text>
            ))}
          </g>
        )}

        {/* ── Ambient roots glow (all stages) ── */}
        <ellipse cx={cx} cy={groundY + potH*.6}
          rx={size*.06} ry={size*.025}
          fill={T.amber} opacity="0.18"
          style={{animation:"bt-breathe 3s ease-in-out infinite"}}
        />
      </svg>

      {/* Stage label */}
      <div style={{
        fontSize:10, color:stageColor[stage],
        fontFamily:T.display, fontStyle:"italic",
        letterSpacing:.5, textAlign:"center",
        opacity:.85,
        transition:"color .8s ease",
      }}>
        {STAGES[stage]}
        {stage >= 6 && " 🌸"}
      </div>

      {/* Progress bar under plant */}
      <div style={{width:size*.7, height:4, background:T.border, borderRadius:2, overflow:"hidden"}}>
        <div style={{
          height:"100%", borderRadius:2,
          background:`linear-gradient(90deg,${T.forest},${T.amber})`,
          width:`${overall}%`,
          transition:"width 1.2s cubic-bezier(.22,1,.36,1)",
        }}/>
      </div>
      <div style={{fontSize:9, color:T.muted, fontFamily:T.mono}}>{overall}% completado</div>
    </div>
  );
}

const inp = (extra={}) => ({
  width:"100%", background:T.card, border:`1.5px solid ${T.border}`,
  borderRadius:14, padding:"13px 16px", fontSize:14, color:T.ink,
  fontFamily:T.body, fontWeight:300, outline:"none", transition:"border-color .2s", ...extra,
});
const GENDERS = [
  {id:"mujer",label:"Mujer",icon:"🌸"},{id:"hombre",label:"Hombre",icon:"🌿"},
  {id:"nobin",label:"No binario",icon:"☀️"},{id:"prefiero",label:"Prefiero no decir",icon:"🕊️"},
];
function calcAge(dob){
  const b=new Date(dob),now=new Date(); let a=now.getFullYear()-b.getFullYear();
  if(now.getMonth()-b.getMonth()<0||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))a--;
  return a;
}
function ageGroup(dob){
  const a=calcAge(dob);
  return a<25?"18–24":a<35?"25–34":a<45?"35–44":a<55?"45–54":"55+";
}

/* ── PILLAR PROFILING COMPONENT ─────────────────────────────── */
function PillarProfileStep({ pillars, profiles, onChange, onDone, onBack }) {
  const activePillarsWithQ = pillars.filter(id => PILLAR_QUESTIONS[id]);
  const [pillarIdx, setPillarIdx] = useState(0);
  const currentPillarId = activePillarsWithQ[pillarIdx];
  const currentPillar   = ALL_PILLARS.find(p=>p.id===currentPillarId);
  const questions       = PILLAR_QUESTIONS[currentPillarId]?.questions || [];
  const qData           = PILLAR_QUESTIONS[currentPillarId];
  const [qIdx, setQIdx] = useState(0);
  const currentQ        = questions[qIdx];
  const localProfile    = profiles[currentPillarId] || {};

  const totalPillars = activePillarsWithQ.length;
  const overallPct   = Math.round(((pillarIdx + qIdx/questions.length) / totalPillars) * 100);

  function selectCard(optionId) {
    const updated = {...localProfile, [currentQ.id]: optionId};
    onChange(currentPillarId, updated);
  }
  function toggleChip(optionId) {
    const prev = localProfile[currentQ.id] || [];
    let next;
    if (currentQ.multi) {
      next = prev.includes(optionId) ? prev.filter(x=>x!==optionId) : [...prev, optionId];
    } else {
      next = prev.includes(optionId) ? [] : [optionId];
    }
    onChange(currentPillarId, {...localProfile, [currentQ.id]: next});
  }
  function isChipSelected(optionId) {
    const val = localProfile[currentQ.id] || [];
    return Array.isArray(val) ? val.includes(optionId) : false;
  }

  function handleNext() {
    if (qIdx < questions.length - 1) { setQIdx(qIdx+1); return; }
    if (pillarIdx < activePillarsWithQ.length - 1) {
      setPillarIdx(pillarIdx+1); setQIdx(0); return;
    }
    onDone();
  }
  function handleBack() {
    if (qIdx > 0) { setQIdx(qIdx-1); return; }
    if (pillarIdx > 0) { setPillarIdx(pillarIdx-1); setQIdx(questions.length-1); return; }
    onBack();
  }

  const canAdvance = () => {
    const val = localProfile[currentQ?.id];
    if (!val) return false;
    if (Array.isArray(val)) return val.length > 0;
    return !!val;
  };

  if (!currentPillarId || !currentQ) return null;

  return (
    <div className="bt-rise" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Top progress */}
      <div style={{background:T.surface,borderBottom:`1px solid ${T.border}`,padding:"14px 18px 12px"}}>
        <button onClick={handleBack} style={{background:"none",border:"none",color:T.muted,fontSize:12,cursor:"pointer",fontFamily:T.body,marginBottom:10,padding:0}}>← Volver</button>

        {/* Pillar tabs */}
        <div style={{display:"flex",gap:6,overflowX:"auto",scrollbarWidth:"none",marginBottom:12}}>
          {activePillarsWithQ.map((id,i)=>{
            const p=ALL_PILLARS.find(x=>x.id===id);
            const done = i<pillarIdx;
            const active = i===pillarIdx;
            return (
              <div key={id} style={{
                flexShrink:0,
                background:active?p.colorDim:done?`${T.forest}10`:"transparent",
                border:`1px solid ${active?p.color+"66":done?T.forest+"33":T.border}`,
                borderRadius:20,padding:"4px 10px",
                display:"flex",alignItems:"center",gap:5,
              }}>
                <span style={{fontSize:12}}>{done?"✓":p.icon}</span>
                <span style={{fontSize:10,color:active?T.ink:done?T.forest:T.muted,fontWeight:active?500:300}}>{p.name}</span>
              </div>
            );
          })}
        </div>

        {/* Question progress bar */}
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
          <span style={{fontFamily:T.display,fontSize:14,fontWeight:500,color:T.ink}}>{currentPillar.icon} {qData.title}</span>
          <span style={{fontSize:11,color:T.muted,fontFamily:T.mono}}>{qIdx+1}/{questions.length}</span>
        </div>
        <div style={{height:4,background:T.border,borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",borderRadius:2,background:`linear-gradient(90deg,${currentPillar.color},${currentPillar.color}99)`,width:`${((qIdx+1)/questions.length)*100}%`,transition:"width .4s ease"}}/>
        </div>
        {qIdx===0 && <div style={{fontSize:11,color:T.muted,fontStyle:"italic",fontFamily:T.display,marginTop:6}}>{qData.intro}</div>}
      </div>

      {/* Question body */}
      <div className="grow-scroll" style={{padding:"18px 16px 100px 16px",display:"flex",flexDirection:"column",gap:14}}>
        <div style={{fontFamily:T.body,fontSize:14,fontWeight:400,color:T.ink,lineHeight:1.6}}>
          {currentQ.label}
        </div>

        {/* CARD type */}
        {currentQ.type==="card" && (
          <div style={{display:"grid",gridTemplateColumns:currentQ.options.length<=3?"1fr":"1fr 1fr",gap:10}}>
            {currentQ.options.map(opt=>{
              const selected = localProfile[currentQ.id]===opt.id;
              return (
                <div key={opt.id} className="bt-card" onClick={()=>selectCard(opt.id)}
                  style={{
                    background:selected?`${currentPillar.color}14`:T.card,
                    border:`1.5px solid ${selected?currentPillar.color+"66":T.border}`,
                    borderRadius:14,padding:"13px 12px",cursor:"pointer",
                    transition:"all .2s",
                  }}>
                  <div style={{fontSize:22,marginBottom:6}}>{opt.icon}</div>
                  <div style={{fontSize:13,fontWeight:selected?500:400,color:selected?T.ink:"#777",marginBottom:3,fontFamily:T.body}}>{opt.label}</div>
                  <div style={{fontSize:11,color:T.muted,lineHeight:1.4,fontWeight:300}}>{opt.desc}</div>
                  {selected && <div style={{marginTop:8,width:18,height:18,borderRadius:"50%",background:currentPillar.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff"}}>✓</div>}
                </div>
              );
            })}
          </div>
        )}

        {/* CHIP type — con soporte para icon+desc (subcategorias) o solo label (chips simples) */}
        {currentQ.type==="chip" && (()=>{
          const hasIcons = currentQ.options.some(o=>o.icon);
          if (hasIcons) {
            // Subcategorías — botones compactos con ícono + título
            return (
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <div style={{fontSize:11,color:T.muted,marginBottom:2,fontStyle:"italic",fontFamily:T.display}}>
                  {currentQ.multi?"Puedes elegir varias":"Elige una opción"}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {currentQ.options.map(opt=>{
                    const sel = isChipSelected(opt.id);
                    return (
                      <button key={opt.id} onClick={()=>toggleChip(opt.id)}
                        style={{
                          display:"flex",alignItems:"center",gap:7,
                          background: sel ? `${currentPillar.color}18` : T.card,
                          border:`1.5px solid ${sel ? currentPillar.color+"88" : T.border}`,
                          borderRadius:24, padding:"9px 16px",
                          cursor:"pointer", fontFamily:T.body,
                          fontSize:13, color: sel ? T.ink : T.muted,
                          fontWeight: sel ? 500 : 300,
                          transition:"all .18s ease",
                          boxShadow: sel ? `0 2px 10px ${currentPillar.color}22` : "none",
                        }}>
                        <span style={{fontSize:16,lineHeight:1}}>{opt.icon}</span>
                        <span>{opt.label}</span>
                        {sel && <span style={{color:currentPillar.color,fontSize:11,marginLeft:2}}>✓</span>}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          }
          // Chips simples (sin icon)
          return (
            <div>
              <div style={{fontSize:11,color:T.muted,marginBottom:10,fontStyle:"italic",fontFamily:T.display}}>
                {currentQ.multi?"Puedes elegir varias opciones":"Elige una opción"}
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {currentQ.options.map(opt=>{
                  const sel=isChipSelected(opt.id);
                  return (
                    <div key={opt.id} onClick={()=>toggleChip(opt.id)}
                      style={{
                        background:sel?`${currentPillar.color}18`:T.card,
                        border:`1.5px solid ${sel?currentPillar.color+"77":T.border}`,
                        borderRadius:20,padding:"8px 16px",cursor:"pointer",
                        fontSize:13,color:sel?T.ink:T.muted,
                        fontWeight:sel?500:300,transition:"all .2s",
                      }}>
                      {sel && <span style={{marginRight:5,color:currentPillar.color,fontSize:11}}>✓</span>}
                      {opt.label}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}
      </div>

      {/* Footer */}
      <div style={{padding:"12px 16px 20px",borderTop:`1px solid ${T.border}`,background:T.surface}}>
        <button className="bt-btn" onClick={handleNext}
          disabled={!canAdvance()}
          style={{
            width:"100%",
            background:canAdvance()?`linear-gradient(135deg,${T.forest},${T.moss})`:T.cardDark,
            border:`1px solid ${canAdvance()?T.forest+"44":T.border}`,
            borderRadius:14,padding:"14px",fontSize:14,
            color:canAdvance()?"#fff":T.muted,
            fontFamily:T.body,fontWeight:500,
            cursor:canAdvance()?"pointer":"not-allowed",
            boxShadow:canAdvance()?`0 6px 20px ${T.forest}33`:"none",
            marginBottom:12,transition:"all .25s",
          }}>
          {qIdx<questions.length-1 ? "Siguiente pregunta →" :
           pillarIdx<activePillarsWithQ.length-1 ? `Siguiente pilar: ${ALL_PILLARS.find(p=>p.id===activePillarsWithQ[pillarIdx+1])?.name} →` :
           "Completar mi perfil →"}
        </button>
        {/* Overall progress */}
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,height:4,background:T.border,borderRadius:2,overflow:"hidden"}}>
            <div style={{height:"100%",borderRadius:2,background:`linear-gradient(90deg,${T.amber},${T.forest})`,width:`${overallPct}%`,transition:"width .5s ease"}}/>
          </div>
          <span style={{fontSize:10,color:T.muted,fontFamily:T.mono,flexShrink:0}}>{overallPct}%</span>
        </div>
      </div>
    </div>
  );
}

/* ── MAIN ONBOARDING ────────────────────────────────────────── */
/*
  Nuevo flujo de 6 pasos:
  0 · Bienvenida + nombre
  1 · Perfil personal (fecha, género, email)
  2 · Propósitos (texto libre — 1 a 3 propósitos)
  3 · ARIA sugiere pilares → usuario confirma / ajusta
  4 · Perfil detallado por pilar
  5 · Confirmación y entrada
*/
function Onboarding({ onDone }) {
  const [step,           setStep]           = useState(0);
  const [name,           setName]           = useState("");
  const [birthdate,      setBirthdate]      = useState("");
  const [gender,         setGender]         = useState("");
  const [email,          setEmail]          = useState("");
  const [error,          setError]          = useState("");
  // Step 2 — propósitos
  const [propositos,     setPropositos]     = useState(["","",""]);
  const [propCount,      setPropCount]      = useState(1);
  // Step 3 — ARIA sugiere pilares
  const [ariaLoading,    setAriaLoading]    = useState(false);
  const [ariaSugg,       setAriaSugg]       = useState(null); // {pilares:[ids], razon:string}
  const [selected,       setSelected]       = useState(new Set(["fundamentos"]));
  // Step 4 — perfil por pilar
  const [pillarProfiles, setPillarProfiles] = useState({});
  const DOTS = 6;

  function calcAge(dob){
    const b=new Date(dob),now=new Date(); let a=now.getFullYear()-b.getFullYear();
    if(now.getMonth()-b.getMonth()<0||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))a--;
    return a;
  }
  function handleProfileNext(){
    setError("");
    if(!birthdate){setError("Por favor ingresa tu fecha de nacimiento.");return;}
    const age=calcAge(birthdate);
    if(age<18){setError(`Grow está diseñada para mayores de 18 años. Tienes ${age} años — ¡vuelve cuando puedas! 🌱`);return;}
    if(!gender){setError("Por favor selecciona tu género.");return;}
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setError("Por favor ingresa un correo electrónico válido.");return;}
    setStep(2);
  }

  // Propósitos helpers
  const activeProp = propositos.slice(0, propCount).filter(p => p.trim());
  function setProp(i, val) {
    const next = [...propositos];
    next[i] = val;
    setPropositos(next);
  }

  // ARIA sugiere pilares basándose en los propósitos escritos
  async function pedirSugerencias() {
    setAriaLoading(true);
    setStep(3);
    const propText = activeProp.map((p,i) => `${i+1}. "${p}"`).join("\n");
    const pillarList = ALL_PILLARS.filter(p=>p.id!=="fundamentos").map(p=>`${p.id} (${p.name})`).join(", ");
    try {
      const res = await fetch("/api/aria", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 400,
          system: `Eres ARIA de Building Together. Analiza los propósitos del usuario y sugiere los pilares más relevantes.
Pilares disponibles (además de Fundamentos que siempre está activo): ${pillarList}.
Responde SOLO en JSON con este formato exacto, sin texto extra ni backticks:
{"pilares":["id1","id2","id3"],"razon":"Una frase cálida de 20-30 palabras explicando por qué estos pilares conectan con sus propósitos. En español."}
Sugiere entre 2 y 4 pilares. Sé preciso y genuino.`,
          messages: [{ role: "user", content: `Mis propósitos de vida son:\n${propText}` }],
        }),
      });
      const data = await res.json();
      const text = data.content?.map(b=>b.text||"").join("") || "";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setAriaSugg(parsed);
      // Pre-seleccionar los pilares sugeridos
      const newSel = new Set(["fundamentos"]);
      (parsed.pilares || []).forEach(id => newSel.add(id));
      setSelected(newSel);
    } catch {
      // Fallback si falla la API
      setAriaSugg({ pilares:["habitos","fundamentos"], razon:"Basándome en tus propósitos, estos pilares serán tu mejor punto de partida. Puedes ajustar los que quieras." });
      setSelected(new Set(["fundamentos","habitos"]));
    }
    setAriaLoading(false);
  }

  const toggle = id => {
    if(id==="fundamentos") return;
    const s=new Set(selected);
    s.has(id)?s.delete(id):s.add(id);
    setSelected(s);
  };
  function updatePillarProfile(pillarId, data){
    setPillarProfiles(prev=>({...prev,[pillarId]:data}));
  }

  const DotBar = ({active}) => (
    <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:14}}>
      {Array.from({length:DOTS}).map((_,i)=>(
        <div key={i} style={{width:i===active?22:6,height:6,borderRadius:3,background:i<=active?T.forest:T.border,transition:"all .35s ease"}}/>
      ))}
    </div>
  );

  return (
    <div className="bt-grain" style={{flex:1,minHeight:0,background:T.bg,fontFamily:T.body,color:T.ink,display:"flex",flexDirection:"column",overflow:"hidden",width:"100%",maxWidth:520,margin:"0 auto"}}>
      <style>{GLOBAL_CSS}</style>

      {/* ══ 0 · BIENVENIDA + NOMBRE ══════════════════════════════ */}
      {step===0&&(
        <div className="bt-bloom" style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 28px",gap:24,textAlign:"center"}}>
          <div style={{position:"relative"}}>
            <div style={{width:88,height:88,borderRadius:28,background:`linear-gradient(145deg,${T.forest}22,${T.amber}22)`,border:`1.5px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:40,animation:"bt-breathe 3.5s ease infinite",boxShadow:`0 12px 40px ${T.sand}`}}>🌱</div>
            <div style={{position:"absolute",top:-6,right:-6,fontSize:18,animation:"bt-sway 3s ease-in-out infinite"}}>✦</div>
          </div>
          <div>
            <div style={{fontFamily:T.display,fontSize:58,fontWeight:300,letterSpacing:-2,lineHeight:1,color:T.forest,marginBottom:4}}>Grow</div>
            <div style={{fontFamily:T.display,fontSize:14,fontWeight:300,letterSpacing:1,color:T.muted,fontStyle:"italic",marginBottom:2}}>by Building Together</div>
            <div style={{fontSize:10,color:T.faint,letterSpacing:3,textTransform:"uppercase",fontWeight:300}}>Tu compañero de vida</div>
          </div>
          <p style={{fontSize:14,color:T.muted,lineHeight:1.8,maxWidth:300,fontWeight:300}}>Con disciplina, constancia y amor propio — construimos juntos la versión de ti que quieres ser.</p>
          <div style={{width:"100%",maxWidth:320}}>
            <div style={{fontSize:11,color:T.muted,marginBottom:8,letterSpacing:1.5,textTransform:"uppercase"}}>¿Cómo te llamas?</div>
            <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&name.trim()&&setStep(1)} placeholder="Tu nombre…" style={{...inp(),fontFamily:T.display,fontSize:15,fontWeight:400}} onFocus={e=>e.target.style.borderColor=T.forest} onBlur={e=>e.target.style.borderColor=T.border}/>
          </div>
          <button className="bt-btn" onClick={()=>name.trim()&&setStep(1)} style={{background:`linear-gradient(135deg,${T.forest},${T.moss})`,border:"none",borderRadius:16,padding:"15px 48px",fontSize:14,color:"#fff",fontFamily:T.body,fontWeight:500,cursor:name.trim()?"pointer":"not-allowed",opacity:name.trim()?1:.5,boxShadow:`0 8px 28px ${T.forest}44`}}>Comenzar mi viaje →</button>
          <DotBar active={0}/>
        </div>
      )}

      {/* ══ 1 · PERFIL PERSONAL ══════════════════════════════════ */}
      {step===1&&(
        <div className="bt-rise" style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"20px 20px 14px",borderBottom:`1px solid ${T.border}`,background:T.surface}}>
            <button onClick={()=>setStep(0)} style={{background:"none",border:"none",color:T.muted,fontSize:12,cursor:"pointer",fontFamily:T.body,marginBottom:10,padding:0}}>← Volver</button>
            <div style={{fontFamily:T.display,fontSize:22,fontWeight:300,color:T.ink,marginBottom:4}}>{name?`Un poco sobre ti, ${name} 🌿`:"Tu perfil 🌿"}</div>
            <div style={{fontSize:13,color:T.muted,fontWeight:300,lineHeight:1.6}}>Esta información permite que ARIA te acompañe con recomendaciones precisas para tu etapa de vida.</div>
            <div style={{marginTop:10,background:`${T.forest}0a`,border:`1px solid ${T.forest}22`,borderRadius:10,padding:"9px 12px",display:"flex",gap:8}}>
              <span style={{fontSize:13,flexShrink:0}}>🔒</span>
              <span style={{fontSize:11,color:T.muted,lineHeight:1.5,fontWeight:300}}>Datos privados y seguros. Nunca se comparten con terceros.</span>
            </div>
          </div>
          <div className="grow-scroll" style={{padding:"18px 18px 100px 18px",display:"flex",flexDirection:"column",gap:18}}>
            <div>
              <div style={{fontSize:11,color:T.muted,marginBottom:8,letterSpacing:1.5,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}><span>🎂</span> Fecha de nacimiento</div>
              <input type="date" value={birthdate} onChange={e=>{setBirthdate(e.target.value);setError("");}} max={new Date(new Date().setFullYear(new Date().getFullYear()-18)).toISOString().split("T")[0]} style={{...inp(),colorScheme:"light"}} onFocus={e=>e.target.style.borderColor=T.forest} onBlur={e=>e.target.style.borderColor=T.border}/>
              {birthdate&&calcAge(birthdate)>=18&&(<div style={{fontSize:11,color:T.forest,marginTop:6,fontFamily:T.display,fontStyle:"italic"}}>✓ {calcAge(birthdate)} años · Grupo {ageGroup(birthdate)}</div>)}
            </div>
            <div>
              <div style={{fontSize:11,color:T.muted,marginBottom:10,letterSpacing:1.5,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}><span>✦</span> Género</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {GENDERS.map(g=>(
                  <div key={g.id} onClick={()=>{setGender(g.id);setError("");}} style={{background:gender===g.id?`${T.forest}12`:T.card,border:`1.5px solid ${gender===g.id?T.forest+"66":T.border}`,borderRadius:12,padding:"11px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,transition:"all .2s"}}>
                    <span style={{fontSize:18}}>{g.icon}</span>
                    <span style={{fontSize:13,color:gender===g.id?T.forest:T.muted,fontWeight:gender===g.id?500:300}}>{g.label}</span>
                    {gender===g.id&&<span style={{marginLeft:"auto",color:T.forest,fontSize:12}}>✓</span>}
                  </div>
                ))}
              </div>
            </div>
            <div>
              <div style={{fontSize:11,color:T.muted,marginBottom:8,letterSpacing:1.5,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}><span>📧</span> Correo electrónico</div>
              <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setError("");}} placeholder="tu@correo.com" style={inp()} onFocus={e=>e.target.style.borderColor=T.forest} onBlur={e=>e.target.style.borderColor=T.border}/>
              <div style={{fontSize:10,color:T.muted,marginTop:5,fontWeight:300}}>Para tu cuenta y resúmenes de progreso.</div>
            </div>
            {error&&(<div style={{background:`${T.terra}10`,border:`1px solid ${T.terra}44`,borderRadius:12,padding:"13px 15px",display:"flex",gap:10,animation:"bt-rise2 .3s ease"}}><span style={{fontSize:16,flexShrink:0}}>🌾</span><span style={{fontSize:12,color:T.terra,lineHeight:1.6,fontWeight:300}}>{error}</span></div>)}
          </div>
          <div style={{padding:"14px 18px 20px",borderTop:`1px solid ${T.border}`,background:T.surface}}>
            <button className="bt-btn" onClick={handleProfileNext} style={{width:"100%",background:`linear-gradient(135deg,${T.forest},${T.moss})`,border:"none",borderRadius:14,padding:"15px",fontSize:14,color:"#fff",fontFamily:T.body,fontWeight:500,cursor:"pointer",boxShadow:`0 6px 22px ${T.forest}33`,marginBottom:0}}>Continuar →</button>
            <DotBar active={1}/>
          </div>
        </div>
      )}

      {/* ══ 2 · PROPÓSITOS (texto libre) ════════════════════════ */}
      {step===2&&(
        <div className="bt-rise" style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"20px 20px 14px",borderBottom:`1px solid ${T.border}`,background:T.surface}}>
            <button onClick={()=>setStep(1)} style={{background:"none",border:"none",color:T.muted,fontSize:12,cursor:"pointer",fontFamily:T.body,marginBottom:10,padding:0}}>← Volver</button>
            <div style={{fontFamily:T.display,fontSize:22,fontWeight:300,color:T.ink,marginBottom:4}}>
              {name?`¿Qué quieres construir, ${name}?`:"¿Qué quieres construir?"}
            </div>
            <div style={{fontSize:13,color:T.muted,fontWeight:300,lineHeight:1.6}}>
              Escribe tus propósitos con tus propias palabras. ARIA los leerá y te sugerirá los pilares más adecuados para ti.
            </div>
          </div>

          <div className="grow-scroll" style={{padding:"20px 18px 100px 18px",display:"flex",flexDirection:"column",gap:20}}>
            {/* Propósito principal — siempre visible */}
            <div>
              <div style={{fontSize:11,color:T.forest,marginBottom:10,letterSpacing:1.5,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:20,height:20,borderRadius:6,background:T.forest,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:"bold",flexShrink:0}}>1</span>
                Propósito principal
              </div>
              <textarea
                value={propositos[0]}
                onChange={e=>setProp(0,e.target.value)}
                placeholder={`Ej: "Quiero tener energía para disfrutar el día sin sentirme agotado/a…"`}
                rows={3}
                style={{...inp(),resize:"none",lineHeight:1.7,fontFamily:T.display,fontSize:14,fontWeight:300,fontStyle:propositos[0]?"normal":"italic"}}
                onFocus={e=>e.target.style.borderColor=T.forest}
                onBlur={e=>e.target.style.borderColor=T.border}
              />
              {propositos[0].trim().length>0&&<div style={{fontSize:10,color:T.forest,marginTop:5,fontFamily:T.display,fontStyle:"italic"}}>✓ {propositos[0].trim().split(/\s+/).length} palabras</div>}
            </div>

            {/* Propósito 2 */}
            {propCount>=2&&(
              <div className="bt-rise">
                <div style={{fontSize:11,color:T.amber,marginBottom:10,letterSpacing:1.5,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}>
                  <span style={{width:20,height:20,borderRadius:6,background:T.amber,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:"bold",flexShrink:0}}>2</span>
                  Segundo propósito
                </div>
                <textarea
                  value={propositos[1]}
                  onChange={e=>setProp(1,e.target.value)}
                  placeholder={`Ej: "Quiero lanzar mi proyecto personal y generar ingresos propios…"`}
                  rows={3}
                  style={{...inp(),resize:"none",lineHeight:1.7,fontFamily:T.display,fontSize:14,fontWeight:300,fontStyle:propositos[1]?"normal":"italic"}}
                  onFocus={e=>e.target.style.borderColor=T.amber}
                  onBlur={e=>e.target.style.borderColor=T.border}
                />
              </div>
            )}

            {/* Propósito 3 */}
            {propCount>=3&&(
              <div className="bt-rise">
                <div style={{fontSize:11,color:T.sky,marginBottom:10,letterSpacing:1.5,textTransform:"uppercase",display:"flex",alignItems:"center",gap:6}}>
                  <span style={{width:20,height:20,borderRadius:6,background:T.sky,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:"bold",flexShrink:0}}>3</span>
                  Tercer propósito
                </div>
                <textarea
                  value={propositos[2]}
                  onChange={e=>setProp(2,e.target.value)}
                  placeholder={`Ej: "Quiero mejorar mis relaciones y conectar más profundamente…"`}
                  rows={3}
                  style={{...inp(),resize:"none",lineHeight:1.7,fontFamily:T.display,fontSize:14,fontWeight:300,fontStyle:propositos[2]?"normal":"italic"}}
                  onFocus={e=>e.target.style.borderColor=T.sky}
                  onBlur={e=>e.target.style.borderColor=T.border}
                />
              </div>
            )}

            {/* Agregar propósito */}
            {propCount<3&&(
              <button onClick={()=>setPropCount(c=>c+1)} style={{background:"transparent",border:`1.5px dashed ${T.borderH}`,borderRadius:12,padding:"12px",fontSize:12,color:T.muted,cursor:"pointer",fontFamily:T.body,fontWeight:300,display:"flex",alignItems:"center",justifyContent:"center",gap:8,transition:"all .2s"}}
                onMouseEnter={e=>{e.target.style.borderColor=T.forest;e.target.style.color=T.forest;}}
                onMouseLeave={e=>{e.target.style.borderColor=T.borderH;e.target.style.color=T.muted;}}>
                + Agregar otro propósito
              </button>
            )}

            {/* Nota ARIA */}
            <div style={{background:`${T.forest}08`,border:`1px solid ${T.forest}22`,borderRadius:12,padding:"12px 14px",display:"flex",gap:10}}>
              <span style={{fontSize:16,flexShrink:0}}>🌿</span>
              <div style={{fontSize:11,color:T.muted,lineHeight:1.6,fontWeight:300}}>
                <strong style={{color:T.forest,fontFamily:T.display}}>ARIA</strong> analizará tus propósitos y te sugerirá los pilares que mejor los conectan. Podrás ajustarlos libremente.
              </div>
            </div>
          </div>

          <div style={{padding:"14px 18px 20px",borderTop:`1px solid ${T.border}`,background:T.surface}}>
            <button className="bt-btn" onClick={()=>{ if(activeProp.length>0) pedirSugerencias(); }}
              disabled={activeProp.length===0}
              style={{width:"100%",background:activeProp.length>0?`linear-gradient(135deg,${T.forest},${T.moss})`:T.cardDark,border:"none",borderRadius:14,padding:"15px",fontSize:14,color:activeProp.length>0?"#fff":T.muted,fontFamily:T.body,fontWeight:500,cursor:activeProp.length>0?"pointer":"not-allowed",boxShadow:activeProp.length>0?`0 6px 22px ${T.forest}33`:"none",marginBottom:0,transition:"all .25s"}}>
              🌿 Que ARIA analice mis propósitos →
            </button>
            <DotBar active={2}/>
          </div>
        </div>
      )}

      {/* ══ 3 · ARIA SUGIERE PILARES ════════════════════════════ */}
      {step===3&&(
        <div className="bt-rise" style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"20px 20px 14px",borderBottom:`1px solid ${T.border}`,background:T.surface}}>
            {!ariaLoading&&<button onClick={()=>setStep(2)} style={{background:"none",border:"none",color:T.muted,fontSize:12,cursor:"pointer",fontFamily:T.body,marginBottom:10,padding:0}}>← Volver</button>}
            <div style={{fontFamily:T.display,fontSize:22,fontWeight:300,color:T.ink,marginBottom:4}}>
              {ariaLoading ? "ARIA está analizando… 🌿" : "Tu jardín personal 🌿"}
            </div>
            <div style={{fontSize:13,color:T.muted,fontWeight:300,lineHeight:1.6}}>
              {ariaLoading ? "Un momento — ARIA está leyendo tus propósitos para sugerirte los mejores pilares." : "ARIA sugirió estos pilares basándose en lo que escribiste. Puedes ajustarlos como quieras."}
            </div>
          </div>

          {ariaLoading ? (
            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:24,padding:"40px 28px"}}>
              <div style={{width:64,height:64,borderRadius:20,background:`${T.forest}18`,border:`1.5px solid ${T.forest}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,animation:"bt-breathe 2s ease infinite"}}>🌿</div>
              <div style={{fontFamily:T.display,fontSize:15,fontStyle:"italic",color:T.muted,textAlign:"center",lineHeight:1.7,maxWidth:260}}>
                Leyendo tus propósitos y conectando con los pilares que mejor los nutren…
              </div>
              <div style={{display:"flex",gap:8}}>
                {[0,1,2].map(i=>(
                  <div key={i} style={{width:8,height:8,borderRadius:"50%",background:T.forest,opacity:.4,animation:`bt-pulse 1.2s ease ${i*.2}s infinite`}}/>
                ))}
              </div>
            </div>
          ) : (
            <div className="grow-scroll" style={{padding:"16px 16px 100px 16px",display:"flex",flexDirection:"column",gap:12}}>
              {/* Propósitos resumen */}
              <div style={{background:`${T.forest}08`,border:`1px solid ${T.forest}22`,borderRadius:12,padding:"12px 14px",marginBottom:4}}>
                <div style={{fontSize:10,color:T.forest,letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Tus propósitos</div>
                {activeProp.map((p,i)=>(
                  <div key={i} style={{fontSize:12,color:T.muted,lineHeight:1.6,marginBottom:i<activeProp.length-1?6:0,fontFamily:T.display,fontStyle:"italic",paddingLeft:10,borderLeft:`2px solid ${T.forest}44`}}>"{p}"</div>
                ))}
              </div>

              {/* Mensaje de ARIA */}
              {ariaSugg&&(
                <div style={{background:T.card,border:`1px solid ${T.forest}33`,borderRadius:14,padding:"14px 16px",display:"flex",gap:10}}>
                  <div style={{width:32,height:32,borderRadius:10,background:`${T.forest}18`,border:`1px solid ${T.forest}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>🌿</div>
                  <div style={{fontSize:13,color:T.ink,lineHeight:1.7,fontWeight:300,fontFamily:T.display,fontStyle:"italic"}}>{ariaSugg.razon}</div>
                </div>
              )}

              {/* Lista de pilares con sugeridos destacados */}
              <div style={{fontSize:11,color:T.muted,letterSpacing:2,textTransform:"uppercase",marginTop:4,marginBottom:2}}>Elige tus pilares</div>
              {ALL_PILLARS.map((p,i)=>{
                const on=selected.has(p.id);
                const locked=p.id==="fundamentos";
                const suggested=ariaSugg?.pilares?.includes(p.id);
                return(
                  <div key={p.id} className={!locked?"bt-card":""} onClick={()=>toggle(p.id)}
                    style={{background:on?p.colorDim:T.card,border:`1.5px solid ${on?p.color+"66":suggested?p.color+"44":T.border}`,borderRadius:16,padding:"13px 15px",cursor:locked?"default":"pointer",transition:"all .22s ease",animation:`bt-rise .4s ease ${i*0.04}s both`,position:"relative"}}>
                    {suggested&&!locked&&(
                      <div style={{position:"absolute",top:10,right:12,fontSize:9,color:T.forest,background:`${T.forest}14`,border:`1px solid ${T.forest}33`,borderRadius:8,padding:"2px 7px",letterSpacing:.5}}>✦ ARIA sugiere</div>
                    )}
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <div style={{width:42,height:42,borderRadius:13,flexShrink:0,background:`linear-gradient(145deg,${p.color}22,${p.color}08)`,border:`1px solid ${p.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{p.icon}</div>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                          <span style={{fontFamily:T.display,fontSize:15,fontWeight:500,color:on?T.ink:"#aaa"}}>{p.name}</span>
                          {locked&&<span style={{fontSize:9,color:p.color,background:`${p.color}18`,padding:"2px 7px",borderRadius:8,letterSpacing:1,textTransform:"uppercase",fontFamily:T.body}}>Esencial</span>}
                        </div>
                        <div style={{fontSize:11,color:T.muted,fontStyle:"italic",fontFamily:T.display}}>{p.quote}</div>
                      </div>
                      <div style={{width:22,height:22,borderRadius:6,flexShrink:0,background:on?p.color:"transparent",border:`1.5px solid ${on?p.color:T.borderH}`,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>
                        {on&&<span style={{color:"#fff",fontSize:12,fontWeight:"bold"}}>✓</span>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {!ariaLoading&&(
            <div style={{padding:"14px 16px 20px",borderTop:`1px solid ${T.border}`,background:T.surface}}>
              <div style={{fontSize:12,color:T.muted,marginBottom:12,textAlign:"center",fontFamily:T.display,fontStyle:"italic"}}>{selected.size} pilar{selected.size!==1?"es":""} elegido{selected.size!==1?"s":""}</div>
              <button className="bt-btn" onClick={()=>setStep(4)}
                style={{width:"100%",background:`linear-gradient(135deg,${T.forest},${T.moss})`,border:"none",borderRadius:14,padding:"15px",fontSize:14,color:"#fff",fontFamily:T.body,fontWeight:500,cursor:"pointer",boxShadow:`0 6px 22px ${T.forest}33`,marginBottom:0}}>
                Personalizar mis pilares →
              </button>
              <DotBar active={3}/>
            </div>
          )}
        </div>
      )}

      {/* ══ 4 · PERFIL POR PILAR ════════════════════════════════ */}
      {step===4&&(
        <PillarProfileStep
          pillars={[...selected]}
          profiles={pillarProfiles}
          onChange={updatePillarProfile}
          onDone={()=>setStep(5)}
          onBack={()=>setStep(3)}
        />
      )}

      {/* ══ 5 · CONFIRMACIÓN ════════════════════════════════════ */}
      {step===5&&(
        <div className="bt-bloom" style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 22px",gap:16,textAlign:"center"}}>
          <div style={{fontSize:58,animation:"bt-leaf 3s ease-in-out infinite",lineHeight:1}}>🌱</div>
          <div>
            <div style={{fontFamily:T.display,fontSize:24,fontWeight:300,color:T.ink,marginBottom:6}}>¡Bienvenido/a a Grow,<br/><em style={{color:T.forest}}>{name}</em>!</div>
            <div style={{fontSize:13,color:T.muted,lineHeight:1.8,maxWidth:300,fontWeight:300}}>ARIA tiene tu perfil completo y tus propósitos. Cada recomendación será única para ti.</div>
          </div>
          {/* Resumen propósitos */}
          {activeProp.length>0&&(
            <div style={{background:T.card,border:`1px solid ${T.forest}33`,borderRadius:14,padding:"14px 18px",width:"100%",maxWidth:320,textAlign:"left",boxShadow:`0 4px 18px ${T.sand}44`}}>
              <div style={{fontFamily:T.display,fontSize:11,color:T.forest,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Tus propósitos</div>
              {activeProp.map((p,i)=>(
                <div key={i} style={{fontSize:12,color:T.muted,fontFamily:T.display,fontStyle:"italic",marginBottom:i<activeProp.length-1?8:0,paddingLeft:10,borderLeft:`2px solid ${T.forest}44`,lineHeight:1.5}}>{p}</div>
              ))}
            </div>
          )}
          {/* Resumen pilares */}
          <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",maxWidth:320}}>
            {[...selected].map(id=>{
              const p=ALL_PILLARS.find(x=>x.id===id);
              return(<div key={id} style={{background:p.colorDim,border:`1px solid ${p.color}44`,borderRadius:20,padding:"5px 12px",fontSize:11,color:T.ink,fontFamily:T.display,fontStyle:"italic"}}>{p.icon} {p.name}</div>);
            })}
          </div>
          <button className="bt-btn" onClick={()=>onDone([...selected],name,birthdate,gender,pillarProfiles,activeProp)}
            style={{background:`linear-gradient(135deg,${T.forest},${T.moss})`,border:"none",borderRadius:16,padding:"15px 44px",fontSize:14,color:"#fff",fontFamily:T.body,fontWeight:500,cursor:"pointer",boxShadow:`0 8px 28px ${T.forest}44`}}>
            Entrar a Grow →
          </button>
          <DotBar active={5}/>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   ARIA CHAT — componente externo para evitar re-mount en cada
   render de MainApp (fix del bug de foco en el textarea)
   ═══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
   CALENDAR EVENT CARD — Visualiza una actividad programada
   ═══════════════════════════════════════════════════════════════ */
function CalendarCard({ event, pillar, onAddTasks }) {
  const today = new Date().toISOString().slice(0,10);
  const [ev, setEv]         = useState({ ...event, startDate: today });
  const [editing, setEditing] = useState(false);
  const [saved,   setSaved]   = useState(false);
  const [notifOk, setNotifOk] = useState(typeof Notification !== "undefined" && Notification.permission === "granted");
  // Recurrence options
  const [repeat,  setRepeat]  = useState(true);
  const [durUnit, setDurUnit] = useState("semanas"); // semanas | dias
  const [durVal,  setDurVal]  = useState(3);

  const pillarData = ALL_PILLARS.find(p=>p.id===pillar) || ALL_PILLARS[0];
  const DIAS_ALL = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
  const daysMap  = { lunes:"L", martes:"M", miércoles:"X", jueves:"J", viernes:"V", sábado:"S", domingo:"D" };

  // Compute endDate from durVal + durUnit
  function computeEnd(start, val, unit) {
    const d = new Date(start+"T12:00");
    if (unit === "semanas") d.setDate(d.getDate() + val*7 - 1);
    else d.setDate(d.getDate() + val - 1);
    return d.toISOString().slice(0,10);
  }

  // Keep endDate in sync when duration changes
  useEffect(() => {
    setEv(p => {
      const d = new Date((p.startDate||today)+"T12:00");
      if (durUnit === "semanas") d.setDate(d.getDate() + durVal*7 - 1);
      else d.setDate(d.getDate() + durVal - 1);
      return { ...p, endDate: d.toISOString().slice(0,10) };
    });
  }, [durVal, durUnit]); // eslint-disable-line

  function toggleDia(d) {
    setEv(p => ({ ...p, dias: p.dias.includes(d) ? p.dias.filter(x=>x!==d) : [...p.dias, d] }));
  }

  function fmtDate(str) {
    if (!str) return "";
    return new Date(str+"T12:00").toLocaleDateString("es",{day:"numeric",month:"long"});
  }

  // Build one task per scheduled day in range
  function buildTasks() {
    const list = [];
    const start = new Date(ev.startDate+"T12:00");
    const end   = new Date(ev.endDate+"T12:00");
    const diaNames = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const activeDias = ev.dias && ev.dias.length > 0 ? ev.dias : DIAS_ALL;
    let d = new Date(start), idx = 0;
    while (d <= end) {
      if (activeDias.includes(diaNames[d.getDay()])) {
        const dateStr = d.toISOString().slice(0,10);
        list.push({
          id: Date.now() + idx++,
          pillarId: pillar,
          text: ev.title + (ev.duracion ? " · " + ev.duracion : ""),
          dueDate: dateStr,
          time: ev.time,
          done: false,
          doneAt: null,
          recurring: repeat,
        });
      }
      d.setDate(d.getDate()+1);
    }
    return list;
  }

  async function handleSave() {
    if ("Notification" in window && Notification.permission !== "granted") {
      const p = await Notification.requestPermission();
      setNotifOk(p === "granted");
    }
    if (Notification?.permission === "granted") {
      new Notification(`🌿 ${ev.title} programado`, {
        body: `Desde hoy · ${ev.time} · ${ev.frecuencia} · ${durVal} ${durUnit}`,
        icon: "/icons/icon-192.png",
      });
    }
    onAddTasks && onAddTasks(buildTasks());
    setSaved(true);
    setEditing(false);
  }

  const Field = ({label, children}) => (
    <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:10,padding:"9px 12px"}}>
      <div style={{fontSize:10,color:T.muted,marginBottom:4}}>{label}</div>
      {children}
    </div>
  );

  return (
    <div className="bt-bloom" style={{
      background:`linear-gradient(135deg,${pillarData.color}10,${T.card})`,
      border:`1.5px solid ${pillarData.color}55`, borderRadius:18,
      padding:"16px 18px", boxShadow:`0 6px 24px ${pillarData.color}18`, marginTop:4,
    }}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div style={{width:42,height:42,borderRadius:13,background:pillarData.colorDim,
          border:`1px solid ${pillarData.color}44`,display:"flex",alignItems:"center",
          justifyContent:"center",fontSize:22,flexShrink:0}}>{pillarData.icon}</div>
        <div style={{flex:1}}>
          {editing
            ? <input value={ev.title} onChange={e=>setEv(p=>({...p,title:e.target.value}))}
                style={{fontFamily:T.display,fontSize:16,fontWeight:500,color:T.ink,
                  background:T.surface,border:`1px solid ${pillarData.color}55`,
                  borderRadius:8,padding:"4px 8px",width:"100%",outline:"none"}}/>
            : <div style={{fontFamily:T.display,fontSize:16,fontWeight:500,color:T.ink,lineHeight:1.2}}>{ev.title}</div>
          }
          <div style={{fontSize:10,color:pillarData.color,letterSpacing:1,textTransform:"uppercase",marginTop:2}}>{pillarData.name}</div>
        </div>
        {!saved && (
          <button onClick={()=>setEditing(p=>!p)}
            style={{background:editing?`${pillarData.color}22`:"transparent",
              border:`1px solid ${pillarData.color}44`,borderRadius:8,
              padding:"5px 10px",fontSize:11,color:pillarData.color,cursor:"pointer",fontFamily:T.body}}>
            {editing ? "✓ Ok" : "✏️ Editar"}
          </button>
        )}
      </div>

      {/* Fields grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <Field label="🕐 Hora">
          {editing
            ? <input type="time" value={ev.time} onChange={e=>setEv(p=>({...p,time:e.target.value}))}
                style={{fontSize:13,color:T.ink,background:"transparent",border:"none",outline:"none",fontFamily:T.mono,width:"100%"}}/>
            : <div style={{fontSize:13,color:T.ink,fontFamily:T.mono,fontWeight:500}}>{ev.time}</div>
          }
        </Field>
        <Field label="⏱️ Duración sesión">
          {editing
            ? <input value={ev.duracion} onChange={e=>setEv(p=>({...p,duracion:e.target.value}))}
                placeholder="ej. 30min"
                style={{fontSize:13,color:T.ink,background:"transparent",border:"none",outline:"none",fontFamily:T.body,width:"100%"}}/>
            : <div style={{fontSize:13,color:T.ink}}>{ev.duracion}</div>
          }
        </Field>
        <Field label="📅 Inicio (hoy)">
          {editing
            ? <input type="date" value={ev.startDate} onChange={e=>setEv(p=>({...p,startDate:e.target.value}))}
                style={{fontSize:12,color:T.ink,background:"transparent",border:"none",outline:"none",fontFamily:T.body,width:"100%"}}/>
            : <div style={{fontSize:12,color:T.ink}}>{fmtDate(ev.startDate)}</div>
          }
        </Field>
        <Field label="🏁 Fin estimado">
          <div style={{fontSize:12,color:T.ink}}>{fmtDate(ev.endDate)}</div>
        </Field>
      </div>

      {/* Frequency */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:10,padding:"9px 12px",marginBottom:12}}>
        <div style={{fontSize:10,color:T.muted,marginBottom:4}}>🔁 Frecuencia</div>
        {editing
          ? <input value={ev.frecuencia} onChange={e=>setEv(p=>({...p,frecuencia:e.target.value}))}
              style={{fontSize:13,color:T.ink,background:"transparent",border:"none",outline:"none",fontFamily:T.body,width:"100%"}}/>
          : <div style={{fontSize:13,color:T.ink}}>{ev.frecuencia}</div>
        }
      </div>

      {/* Recurrence toggle + duration */}
      <div style={{background:`${pillarData.color}08`,border:`1px solid ${pillarData.color}33`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:repeat?10:0}}>
          <div style={{fontSize:13,color:T.ink,fontWeight:400}}>🔄 ¿Se repite?</div>
          <button onClick={()=>setRepeat(p=>!p)}
            style={{width:44,height:24,borderRadius:12,border:"none",cursor:"pointer",
              background:repeat?pillarData.color:T.border,transition:"all .2s",position:"relative"}}>
            <div style={{width:18,height:18,borderRadius:"50%",background:"#fff",
              position:"absolute",top:3,transition:"all .2s",
              left:repeat?22:4,boxShadow:"0 1px 4px rgba(0,0,0,.2)"}}/>
          </button>
        </div>
        {repeat && (
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{fontSize:12,color:T.muted}}>Duración total:</div>
            <div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>
              <button onClick={()=>setDurVal(p=>Math.max(1,p-1))}
                style={{width:28,height:28,borderRadius:8,background:T.surface,border:`1px solid ${T.border}`,
                  fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:T.ink}}>−</button>
              <div style={{fontFamily:T.mono,fontSize:16,color:pillarData.color,fontWeight:"bold",minWidth:24,textAlign:"center"}}>{durVal}</div>
              <button onClick={()=>setDurVal(p=>p+1)}
                style={{width:28,height:28,borderRadius:8,background:T.surface,border:`1px solid ${T.border}`,
                  fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:T.ink}}>+</button>
              <div style={{display:"flex",gap:4}}>
                {["semanas","dias"].map(u=>(
                  <button key={u} onClick={()=>setDurUnit(u)}
                    style={{padding:"4px 10px",borderRadius:8,border:`1px solid ${durUnit===u?pillarData.color+"66":T.border}`,
                      background:durUnit===u?pillarData.colorDim:"transparent",
                      fontSize:11,color:durUnit===u?T.ink:T.muted,cursor:"pointer",fontFamily:T.body}}>
                    {u}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Days of week */}
      {ev.dias && ev.dias.length > 0 && (
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,color:T.muted,marginBottom:6}}>Días activos</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {DIAS_ALL.map(d => {
              const active = ev.dias.includes(d);
              return (
                <button key={d} onClick={()=>editing && toggleDia(d)}
                  style={{width:32,height:32,borderRadius:8,
                    background:active?pillarData.color:T.border,
                    border:`1px solid ${active?pillarData.color+"88":T.border}`,
                    fontSize:10,fontWeight:active?700:300,
                    color:active?"#fff":T.muted,
                    fontFamily:T.mono,cursor:editing?"pointer":"default",transition:"all .15s"}}>
                  {daysMap[d]}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Nota */}
      {ev.nota && (
        <div style={{fontSize:12,color:T.muted,fontFamily:T.display,fontStyle:"italic",
          lineHeight:1.6,marginBottom:12,paddingLeft:10,borderLeft:`2px solid ${pillarData.color}44`}}>

      {/* Summary */}
      {!saved && repeat && (
        <div style={{fontSize:11,color:T.muted,marginBottom:10,textAlign:"center",fontFamily:T.display,fontStyle:"italic"}}>
          Se generarán ~{buildTasks().length} tareas · {fmtDate(ev.startDate)} → {fmtDate(ev.endDate)}
        </div>
      )}

      {/* CTA */}
      <div style={{borderTop:`1px solid ${T.border}`,paddingTop:12}}>
        {!saved ? (
          <button className="bt-btn" onClick={handleSave}
            style={{width:"100%",background:`linear-gradient(135deg,${pillarData.color},${pillarData.color}cc)`,
              border:"none",borderRadius:12,padding:"13px",color:"#fff",fontSize:14,
              cursor:"pointer",fontFamily:T.body,fontWeight:500,
              display:"flex",alignItems:"center",justifyContent:"center",gap:8,
              boxShadow:`0 4px 16px ${pillarData.color}44`}}>
            ✅ Confirmar y agregar a Tareas
          </button>
        ) : (
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
            background:`${pillarData.color}12`,borderRadius:12,border:`1px solid ${pillarData.color}33`}}>
            <span style={{fontSize:20}}>🌱</span>
            <div>
              <div style={{fontSize:13,color:pillarData.color,fontWeight:500}}>¡Plan guardado en Tareas!</div>
              <div style={{fontSize:11,color:T.muted,marginTop:2}}>
                {notifOk?"🔔 Recordatorios activos · ":""}Revisa el tab Tareas
              </div>
