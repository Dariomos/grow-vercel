  const TasksTab = () => {
    const [selPillar, setSelPillar] = useState(myPillars[0]?.id || "");
    const [newText,   setNewText]   = useState("");
    const [newDate,   setNewDate]   = useState("");
    const [newTime,   setNewTime]   = useState("");
    const [newRepeat, setNewRepeat] = useState(false);
    const [newDurVal, setNewDurVal] = useState(1);
    const [newDurUnit,setNewDurUnit]= useState("semanas");
    const [showAdd,   setShowAdd]   = useState(false);
    const [calMonth,  setCalMonth]  = useState(new Date());
    const [calView,   setCalView]   = useState("tasks"); // tasks | calendar | history
    const [selDay,    setSelDay]    = useState(null);

    const today = new Date().toISOString().slice(0,10);
    const pillar = ALL_PILLARS.find(p => p.id === selPillar);

    // Today's pending tasks (all pillars)
    const todayTasks   = tasks.filter(t => !t.done && t.dueDate === today);
    // Pillar-specific tasks
    const pillarTasks  = tasks.filter(t => t.pillarId === selPillar);
    const todayPillar  = pillarTasks.filter(t => !t.done && t.dueDate === today);
    const donePillar   = pillarTasks.filter(t => t.done);
    const progress     = pillarTasks.length ? Math.round(donePillar.length / pillarTasks.length * 100) : 0;

    // History: all done tasks sorted newest first
    const history = [...tasks].filter(t => t.done && t.doneAt).sort((a,b)=>b.doneAt.localeCompare(a.doneAt));

    // Streak
    const streakDays = (() => {
      const days = new Set(tasks.filter(t=>t.done&&t.doneAt).map(t=>t.doneAt.slice(0,10)));
      let streak=0, d=new Date();
      while(days.has(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
      return streak;
    })();

    // Calendar data — ALL scheduled tasks (done + pending)
    const year=calMonth.getFullYear(), month=calMonth.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const tasksByDate={};
    tasks.forEach(t=>{ if(t.dueDate){ (tasksByDate[t.dueDate]=tasksByDate[t.dueDate]||[]).push(t); }});

    // Build recurring tasks from manual add
    function buildRecurring(text, startDate, time, durVal, durUnit, pillarId) {
      const list = [];
      const end = new Date(startDate+"T12:00");
      if (durUnit==="semanas") end.setDate(end.getDate()+durVal*7-1);
      else end.setDate(end.getDate()+durVal-1);
      let d = new Date(startDate+"T12:00");
      let idx = 0;
      while (d <= end) {
        list.push({ id:Date.now()+idx++, pillarId, text, dueDate:d.toISOString().slice(0,10), time, done:false, doneAt:null, recurring:true });
        d.setDate(d.getDate()+1);
      }
      return list;
    }

    function handleAdd() {
      if (!newText.trim()) return;
      if (newRepeat && newDate) {
        setTasks(p=>[...p,...buildRecurring(newText.trim(),newDate,newTime,newDurVal,newDurUnit,selPillar)]);
      } else {
        setTasks(p=>[...p,{id:Date.now(),pillarId:selPillar,text:newText.trim(),dueDate:newDate,time:newTime,done:false,doneAt:null,recurring:false}]);
      }
      setNewText("");setNewDate("");setNewTime("");setNewRepeat(false);setShowAdd(false);
    }

    function TaskRow({task, showDate=false}) {
      const tp = ALL_PILLARS.find(p=>p.id===task.pillarId);
      const [mode, setMode] = useState("view"); // view | edit | replace | confirm_delete

      // Edit mode state
      const [editText, setEditText] = useState(task.text);
      const [editDate, setEditDate] = useState(task.dueDate||"");
      const [editTime, setEditTime] = useState(task.time||"");

      function saveEdit() {
        editTask(task.id, { text:editText, dueDate:editDate, time:editTime });
        setMode("view");
      }

      function saveReplace() {
        editTask(task.id, { text:editText, dueDate:editDate, time:editTime });
        setMode("view");
      }

      // VIEW mode
      if (mode === "view") return (
        <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,
          padding:"12px 14px",display:"flex",alignItems:"flex-start",gap:12,
          boxShadow:`0 2px 8px ${T.sand}33`}}>
          <button onClick={()=>toggleTask(task.id)}
            style={{width:24,height:24,borderRadius:7,flexShrink:0,marginTop:1,
              background:"transparent",border:`2px solid ${tp?.color||T.forest}66`,
              cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>
          </button>
          <div style={{flex:1}}>
            <div style={{fontSize:14,color:T.ink,fontWeight:300,lineHeight:1.5}}>{task.text}</div>
            <div style={{fontSize:11,color:T.muted,marginTop:3,display:"flex",gap:8,flexWrap:"wrap"}}>
              {showDate && task.dueDate && <span>📅 {new Date(task.dueDate+"T12:00").toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})}</span>}
              {!showDate && task.dueDate && task.dueDate !== today && <span>📅 {new Date(task.dueDate+"T12:00").toLocaleDateString("es",{day:"numeric",month:"short"})}</span>}
              {task.time && <span>🕐 {task.time}</span>}
              {task.recurring && <span style={{color:tp?.color}}>🔄</span>}
            </div>
          </div>
          {/* Action buttons */}
          <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
            <button onClick={()=>{setEditText(task.text);setEditDate(task.dueDate||"");setEditTime(task.time||"");setMode("edit");}}
              style={{background:"none",border:"none",fontSize:13,cursor:"pointer",padding:"2px 4px",opacity:.5,color:T.ink}}
              title="Editar">✏️</button>
            <button onClick={()=>{setEditText("");setEditDate(task.dueDate||"");setEditTime(task.time||"");setMode("replace");}}
              style={{background:"none",border:"none",fontSize:13,cursor:"pointer",padding:"2px 4px",opacity:.5,color:T.ink}}
              title="Reemplazar">🔄</button>
            <button onClick={()=>setMode("confirm_delete")}
              style={{background:"none",border:"none",fontSize:15,cursor:"pointer",padding:"2px 4px",opacity:.45,color:T.muted}}>×</button>
          </div>
        </div>
      );

      // CONFIRM DELETE
      if (mode === "confirm_delete") return (
        <div style={{background:`${T.blush}10`,border:`1.5px solid ${T.blush}55`,borderRadius:14,padding:"12px 14px"}}>
          <div style={{fontSize:13,color:T.ink,marginBottom:10,lineHeight:1.4}}>
            ¿Eliminar <strong>"{task.text}"</strong>?
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>deleteTask(task.id)}
              style={{flex:1,background:T.blush,border:"none",borderRadius:10,padding:"9px",
                fontSize:13,color:"#fff",cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
              Sí, eliminar
            </button>
            <button onClick={()=>setMode("view")}
              style={{flex:1,background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,
                padding:"9px",fontSize:13,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
              Cancelar
            </button>
          </div>
        </div>
      );

      // EDIT mode
      if (mode === "edit") return (
        <div style={{background:T.card,border:`1.5px solid ${tp?.color||T.forest}44`,borderRadius:14,padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
          <div style={{fontSize:11,color:T.muted,fontFamily:T.display,fontStyle:"italic"}}>
            ✏️ Editando tarea
          </div>
          <input value={editText} onChange={e=>setEditText(e.target.value)}
            autoFocus onKeyDown={e=>e.key==="Enter"&&saveEdit()}
            style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
              padding:"9px 12px",fontSize:14,color:T.ink,fontFamily:T.body,outline:"none",width:"100%"}}/>
          <div style={{display:"flex",gap:8}}>
            <input type="date" value={editDate} onChange={e=>setEditDate(e.target.value)}
              style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
                padding:"7px 10px",fontSize:12,color:T.ink,fontFamily:T.body,outline:"none"}}/>
            <input type="time" value={editTime} onChange={e=>setEditTime(e.target.value)}
              style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
                padding:"7px 10px",fontSize:12,color:T.ink,fontFamily:T.body,outline:"none"}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={saveEdit}
              style={{flex:1,background:`linear-gradient(135deg,${tp?.color||T.forest},${tp?.color||T.forest}cc)`,
                border:"none",borderRadius:10,padding:"10px",fontSize:13,color:"#fff",
                cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
              Guardar ✓
            </button>
            <button onClick={()=>setMode("view")}
              style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,
                padding:"10px 14px",fontSize:13,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
              Cancelar
            </button>
          </div>
        </div>
      );

      // REPLACE mode
      if (mode === "replace") return (
        <div style={{background:T.card,border:`1.5px solid ${T.amber}55`,borderRadius:14,padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
          <div style={{fontSize:11,color:T.amber,fontFamily:T.display,fontStyle:"italic"}}>
            🔄 Reemplazar tarea
          </div>
          <div style={{fontSize:11,color:T.muted,textDecoration:"line-through",paddingLeft:4}}>{task.text}</div>
          <input value={editText} onChange={e=>setEditText(e.target.value)}
            autoFocus placeholder="Nueva actividad..."
            onKeyDown={e=>e.key==="Enter"&&saveReplace()}
            style={{background:T.surface,border:`1px solid ${T.amber}55`,borderRadius:10,
              padding:"9px 12px",fontSize:14,color:T.ink,fontFamily:T.body,outline:"none",width:"100%"}}/>
          <div style={{display:"flex",gap:8}}>
            <input type="date" value={editDate} onChange={e=>setEditDate(e.target.value)}
              style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
                padding:"7px 10px",fontSize:12,color:T.ink,fontFamily:T.body,outline:"none"}}/>
            <input type="time" value={editTime} onChange={e=>setEditTime(e.target.value)}
              style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
                padding:"7px 10px",fontSize:12,color:T.ink,fontFamily:T.body,outline:"none"}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={saveReplace}
              style={{flex:1,background:`linear-gradient(135deg,${T.amber},${T.amber}cc)`,
                border:"none",borderRadius:10,padding:"10px",fontSize:13,color:"#fff",
                cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
              Reemplazar ✓
            </button>
            <button onClick={()=>setMode("view")}
              style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,
                padding:"10px 14px",fontSize:13,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
              Cancelar
            </button>
          </div>
        </div>
      );

      return null;
    }

    function DoneRow({task}) {
      const tp = ALL_PILLARS.find(p=>p.id===task.pillarId);
      return (
        <div style={{background:`${T.forest}06`,border:`1px solid ${T.forest}20`,
          borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:22,height:22,borderRadius:6,background:tp?.color||T.forest,
            flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
            color:"#fff",fontSize:12,fontWeight:"bold"}}>✓</div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,color:T.muted,fontWeight:300,textDecoration:"line-through"}}>{task.text}</div>
            <div style={{fontSize:10,color:T.muted,marginTop:2,display:"flex",gap:8}}>
              {task.doneAt && <span>✅ {new Date(task.doneAt).toLocaleDateString("es",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>}
              <span style={{color:tp?.color}}>{tp?.icon} {tp?.name}</span>
            </div>
          </div>
        </div>
      );
    }

    return (
      <div style={{padding:"16px 16px 100px",display:"flex",flexDirection:"column",gap:14}}>

        {/* Header */}
        <div className="bt-rise" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontFamily:T.display,fontSize:24,fontWeight:300,color:T.ink}}>Mis Tareas</div>
            <div style={{fontSize:12,color:T.muted,fontWeight:300,marginTop:2}}>
              {todayTasks.length > 0 ? `${todayTasks.length} para hoy` : "Todo al día por hoy 🌿"}
            </div>
          </div>
          {streakDays > 0 && (
            <div style={{background:`${T.amber}18`,border:`1px solid ${T.amber}44`,borderRadius:12,padding:"8px 14px",textAlign:"center"}}>
              <div style={{fontSize:20}}>🔥</div>
              <div style={{fontSize:13,color:T.amber,fontWeight:500}}>{streakDays} días</div>
              <div style={{fontSize:9,color:T.muted}}>racha</div>
            </div>
          )}
        </div>

        {/* View toggle — 3 tabs */}
        <div style={{display:"flex",background:T.card,borderRadius:12,padding:3,border:`1px solid ${T.border}`}}>
          {[{id:"tasks",label:"📋 Hoy"},{id:"calendar",label:"📅 Calendario"},{id:"history",label:"📖 Historial"}].map(v=>(
            <button key={v.id} onClick={()=>{setCalView(v.id);setSelDay(null);}}
              style={{flex:1,background:calView===v.id?T.surface:"transparent",
                border:calView===v.id?`1px solid ${T.border}`:"none",
                borderRadius:10,padding:"8px 4px",fontSize:12,
                color:calView===v.id?T.ink:T.muted,cursor:"pointer",
                fontFamily:T.body,fontWeight:calView===v.id?500:300,transition:"all .2s"}}>
              {v.label}
            </button>
          ))}
        </div>

        {/* ═══ CALENDARIO ═══ */}
        {calView==="calendar" && (
          <CalendarView
            tasks={tasks}
            myPillars={myPillars}
            today={today}
            year={year}
            month={month}
            firstDay={firstDay}
            daysInMonth={daysInMonth}
            selDay={selDay}
            setSelDay={setSelDay}
            calMonth={calMonth}
            setCalMonth={setCalMonth}
          />
        )}

        {/* ═══ TAREAS DE HOY ═══ */}
        {calView==="tasks" && (
          <div style={{display:"flex",flexDirection:"column",gap:14}}>

            {/* Pillar selector */}
            <div style={{display:"flex",gap:6,overflowX:"auto",scrollbarWidth:"none",paddingBottom:2}}>
              {myPillars.map(p=>(
                <button key={p.id} onClick={()=>setSelPillar(p.id)}
                  style={{flexShrink:0,background:selPillar===p.id?p.colorDim:"transparent",
                    border:`1.5px solid ${selPillar===p.id?p.color+"66":T.border}`,
                    borderRadius:20,padding:"7px 14px",fontSize:12,
                    color:selPillar===p.id?T.ink:T.muted,cursor:"pointer",fontFamily:T.body,
                    display:"flex",alignItems:"center",gap:5,transition:"all .2s"}}>
                  <span>{p.icon}</span><span>{p.name}</span>
                </button>
              ))}
            </div>

            {/* Progress bar */}
            {pillarTasks.length>0 && (
              <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"12px 16px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontFamily:T.display,fontSize:14,color:T.ink}}>{pillar?.icon} {pillar?.name}</span>
                  <span style={{fontSize:12,color:pillar?.color,fontWeight:500}}>{donePillar.length}/{pillarTasks.length} · {progress}%</span>
                </div>
                <div style={{height:7,background:T.border,borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:4,
                    background:`linear-gradient(90deg,${pillar?.color},${pillar?.color}99)`,
                    width:`${progress}%`,transition:"width .5s ease"}}/>
                </div>
                {progress===100 && <div style={{fontSize:11,color:T.forest,marginTop:8,textAlign:"center",fontFamily:T.display,fontStyle:"italic"}}>🌸 ¡Completaste todas las tareas de este pilar!</div>}
              </div>
            )}

            {/* Tareas de hoy para este pilar */}
            {todayPillar.length>0 && (
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                <div style={{fontSize:10,color:T.muted,letterSpacing:2,textTransform:"uppercase"}}>HOY · {new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"short"})}</div>
                {todayPillar.map(t=><TaskRow key={t.id} task={t}/>)}
              </div>
            )}

            {/* Próximas tareas (no hoy) */}
            {(() => {
              const upcoming = pillarTasks.filter(t=>!t.done && t.dueDate && t.dueDate>today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,5);
              if (!upcoming.length) return null;
              return (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <div style={{fontSize:10,color:T.muted,letterSpacing:2,textTransform:"uppercase"}}>PRÓXIMAS</div>
                  {upcoming.map(t=><TaskRow key={t.id} task={t} showDate={true}/>)}
                </div>
              );
            })()}

            {/* Add task */}
            {!showAdd ? (
              <button onClick={()=>setShowAdd(true)}
                style={{background:"transparent",border:`1.5px dashed ${pillar?.color||T.forest}55`,
                  borderRadius:14,padding:"13px",fontSize:13,color:pillar?.color||T.forest,
                  cursor:"pointer",fontFamily:T.body,
                  display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                + Agregar tarea a {pillar?.name}
              </button>
            ) : (
              <div style={{background:T.card,border:`1.5px solid ${pillar?.color||T.forest}44`,
                borderRadius:16,padding:14,display:"flex",flexDirection:"column",gap:10}}>
                <div style={{fontSize:11,color:T.muted,fontFamily:T.display,fontStyle:"italic"}}>Nueva tarea — {pillar?.icon} {pillar?.name}</div>
                <input value={newText} onChange={e=>setNewText(e.target.value)}
                  placeholder="¿Qué quieres hacer?" autoFocus
                  onKeyDown={e=>e.key==="Enter"&&handleAdd()}
                  style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
                    padding:"10px 12px",fontSize:14,color:T.ink,fontFamily:T.body,outline:"none",width:"100%"}}/>
                <div style={{display:"flex",gap:8}}>
                  <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)}
                    style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 10px",fontSize:12,color:T.ink,fontFamily:T.body,outline:"none"}}/>
                  <input type="time" value={newTime} onChange={e=>setNewTime(e.target.value)}
                    style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 10px",fontSize:12,color:T.ink,fontFamily:T.body,outline:"none"}}/>
                </div>
                {/* Repeat toggle */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                  background:`${T.forest}08`,borderRadius:10,padding:"10px 12px"}}>
                  <div style={{fontSize:13,color:T.ink}}>🔄 ¿Se repite?</div>
                  <button onClick={()=>setNewRepeat(p=>!p)}
                    style={{width:44,height:24,borderRadius:12,border:"none",cursor:"pointer",
                      background:newRepeat?T.forest:T.border,transition:"all .2s",position:"relative"}}>
                    <div style={{width:18,height:18,borderRadius:"50%",background:"#fff",
                      position:"absolute",top:3,transition:"all .2s",left:newRepeat?22:4,
                      boxShadow:"0 1px 4px rgba(0,0,0,.2)"}}/>
                  </button>
                </div>
                {newRepeat && (
                  <div style={{display:"flex",alignItems:"center",gap:8,paddingLeft:4}}>
                    <div style={{fontSize:12,color:T.muted}}>Durante:</div>
                    <button onClick={()=>setNewDurVal(p=>Math.max(1,p-1))}
                      style={{width:26,height:26,borderRadius:7,background:T.surface,border:`1px solid ${T.border}`,fontSize:15,cursor:"pointer",color:T.ink}}>−</button>
                    <div style={{fontFamily:T.mono,fontSize:15,color:T.forest,fontWeight:"bold",minWidth:20,textAlign:"center"}}>{newDurVal}</div>
                    <button onClick={()=>setNewDurVal(p=>p+1)}
                      style={{width:26,height:26,borderRadius:7,background:T.surface,border:`1px solid ${T.border}`,fontSize:15,cursor:"pointer",color:T.ink}}>+</button>
                    {["semanas","dias"].map(u=>(
                      <button key={u} onClick={()=>setNewDurUnit(u)}
                        style={{padding:"4px 10px",borderRadius:8,border:`1px solid ${newDurUnit===u?T.forest+"66":T.border}`,
                          background:newDurUnit===u?`${T.forest}12`:"transparent",
                          fontSize:11,color:newDurUnit===u?T.forest:T.muted,cursor:"pointer",fontFamily:T.body}}>
                        {u}
                      </button>
                    ))}
                  </div>
                )}
                <div style={{display:"flex",gap:8}}>
                  <button onClick={handleAdd}
                    style={{flex:1,background:`linear-gradient(135deg,${pillar?.color||T.forest},${pillar?.color||T.forest}bb)`,
                      border:"none",borderRadius:10,padding:"11px",fontSize:13,color:"#fff",
                      cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
                    Guardar ✓
                  </button>
                  <button onClick={()=>{setShowAdd(false);setNewText("");setNewDate("");setNewTime("");setNewRepeat(false);}}
                    style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,
                      padding:"11px 16px",fontSize:13,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
                    Cancelar
                  </button>
                </div>
              </div>
            )}

            {/* Notif banner */}
            {!notifGranted && "Notification" in window && (
              <button onClick={requestNotifPermission}
                style={{background:`${T.amber}12`,border:`1px solid ${T.amber}33`,borderRadius:12,
                  padding:"10px 14px",fontSize:13,color:T.amber,cursor:"pointer",fontFamily:T.body,
                  textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                <span>🔔</span>
                <div><div style={{fontWeight:500}}>Activar recordatorios</div><div style={{fontSize:11,opacity:.7}}>Te avisamos a la hora de cada tarea</div></div>
              </button>
            )}

            {/* Empty */}
            {pillarTasks.length===0 && (
              <div style={{textAlign:"center",padding:"40px 16px",color:T.muted}}>
                <div style={{fontSize:40,marginBottom:10}}>🌱</div>
                <div style={{fontFamily:T.display,fontSize:17,fontStyle:"italic",marginBottom:4,color:T.ink}}>Sin tareas aún</div>
                <div style={{fontSize:13,fontWeight:300}}>Agrega tu primera actividad para {pillar?.name}</div>
              </div>
            )}
          </div>
        )}

        {/* ═══ HISTORIAL ═══ */}
        {calView==="history" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

}

// SUPABASE CLIENT

const SUPA_URL  = "https://iiconaicebgryovfmjyr.supabase.co";
const SUPA_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpY29uYWljZWJncnlvdmZtanlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTYxNDQsImV4cCI6MjA4ODc3MjE0NH0.NoIX3Dh-YuI64Uq1Izsnx73mMEYdCdxE_IaU2V2Cgxs";
const TERMS_VERSION = "1.0.0";

// Minimal Supabase client (no SDK needed — pure fetch)
const supa = {
  // Auth
  async signUp(email, password) {
    const r = await fetch(`${SUPA_URL}/auth/v1/signup`, {
      method:"POST", headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({ email, password })
    });
    return r.json();
  },
  async signIn(email, password) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method:"POST", headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({ email, password })
    });
    return r.json();
  },
  async signOut(token) {
    await fetch(`${SUPA_URL}/auth/v1/logout`, {
      method:"POST", headers:{"apikey":SUPA_KEY,"Authorization":`Bearer ${token}`}
    });
  },
  async resetPassword(email) {
    const r = await fetch(`${SUPA_URL}/auth/v1/recover`, {
      method:"POST", headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({ email })
    });
    return r.json();
  },
  async refreshToken(refreshToken) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method:"POST", headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    return r.json();
  },

  // DB helpers
  headers(token) {
    return { "apikey":SUPA_KEY, "Authorization":`Bearer ${token}`,
             "Content-Type":"application/json", "Prefer":"return=representation" };
  },

  async getProfile(token, userId) {
    const r = await fetch(`${SUPA_URL}/rest/v1/profiles?id=eq.${userId}&select=*`, {
      headers: this.headers(token)
    });
    const d = await r.json();
    return Array.isArray(d) ? d[0] : null;
  },

  async upsertProfile(token, userId, data) {
    await fetch(`${SUPA_URL}/rest/v1/profiles`, {
      method:"POST",
      headers: {...this.headers(token), "Prefer":"resolution=merge-duplicates"},
      body: JSON.stringify({ id: userId, ...data, updated_at: new Date().toISOString() })
    });
  },

  async getTasks(token, userId) {
    const r = await fetch(`${SUPA_URL}/rest/v1/tasks?user_id=eq.${userId}&order=created_at.asc`, {
      headers: this.headers(token)
    });
    const d = await r.json();
    return Array.isArray(d) ? d : [];
  },

  async upsertTask(token, userId, task) {
    await fetch(`${SUPA_URL}/rest/v1/tasks`, {
      method:"POST",
      headers: {...this.headers(token), "Prefer":"resolution=merge-duplicates"},
      body: JSON.stringify({
        id: String(task.id), user_id: userId,
        pillar_id: task.pillarId, text: task.text,
        due_date: task.dueDate, time: task.time,
        done: task.done, done_at: task.doneAt,
        recurring: task.recurring || false,
        updated_at: new Date().toISOString()
      })
    });
  },

  async deleteSingleTask(token, taskId) {
    await fetch(`${SUPA_URL}/rest/v1/tasks?id=eq.${taskId}`, {
      method:"DELETE", headers: this.headers(token)
    });
  },

  async logConsent(token, userId) {
    await fetch(`${SUPA_URL}/rest/v1/consent_log`, {
      method:"POST", headers: this.headers(token),
      body: JSON.stringify({
        user_id: userId, version: TERMS_VERSION,
        user_agent: navigator.userAgent.slice(0,200)
      })
    });
  },

  async requestDeletion(token, userId, reason) {
    await fetch(`${SUPA_URL}/rest/v1/deletion_requests`, {
      method:"POST", headers: this.headers(token),
      body: JSON.stringify({ user_id: userId, reason })
    });
  },

  // Persist session in localStorage
  saveSession(session) {
    try { localStorage.setItem("grow_session", JSON.stringify(session)); } catch {}
  },
  loadSession() {
    try { return JSON.parse(localStorage.getItem("grow_session")); } catch { return null; }
  },
  clearSession() {
    try { localStorage.removeItem("grow_session"); } catch {}
  }
};

// AUTH SCREEN — Login / Register
// ═══════════════════════════════════════════════════════════════
function AuthScreen({ onAuth }) {
  const [mode,     setMode]     = useState("login"); // login | register | reset | verify
  const [email,    setEmail]    = useState("");
  const [password, setPassword] = useState("");
  const [confirm,  setConfirm]  = useState("");
  const [consent,  setConsent]  = useState(false);
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState("");
  const [msg,      setMsg]      = useState("");
  const [showPass, setShowPass] = useState(false);

  async function handleLogin() {
    if (!email || !password) return setError("Completa todos los campos");
    setLoading(true); setError("");
    try {
      const data = await supa.signIn(email, password);
      setLoading(false);

      // Show raw error for debugging
      if (!data) { setError("Sin respuesta del servidor"); return; }
      if (data.error_description) { setError(data.error_description); return; }
      if (data.error) { setError(typeof data.error === "string" ? data.error : data.error?.message || JSON.stringify(data.error)); return; }
      if (!data.access_token) { setError("No se recibió token. Respuesta: " + JSON.stringify(data).slice(0,120)); return; }

      if (!data.user?.email_confirmed_at) {
        setError("Confirma tu email antes de ingresar. Revisa tu bandeja de entrada.");
        return;
      }
      supa.saveSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      onAuth(data.access_token, data.user);
    } catch(e) {
      setLoading(false);
      setError("Error de conexión: " + e.message);
    }
  }

  async function handleRegister() {
    if (!email || !password || !confirm) return setError("Completa todos los campos");
    if (password !== confirm) return setError("Las contraseñas no coinciden");
    if (password.length < 8) return setError("La contraseña debe tener al menos 8 caracteres");
    if (!consent) return setError("Debes aceptar los Términos y Política de Privacidad para continuar");
    setLoading(true); setError("");
    const data = await supa.signUp(email, password);
    setLoading(false);
    if (data.error) { setError(data.error.message || "Error al registrar"); return; }
    setMode("verify");
  }

  async function handleReset() {
    if (!email) return setError("Ingresa tu email");
    setLoading(true); setError("");
    await supa.resetPassword(email);
    setLoading(false);
    setMsg("Te enviamos un enlace para restablecer tu contraseña. Revisa tu correo.");
  }

  const inp = {
    background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12,
    padding: "13px 14px", fontSize: 15, color: T.ink, fontFamily: T.body,
    outline: "none", width: "100%"
  };

  if (showPrivacy) return <PrivacyPolicy onBack={()=>setShowPrivacy(false)}/>;

  if (mode === "verify") return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",
      justifyContent:"center",padding:32,background:"#F7F3ED",gap:20,textAlign:"center"}}>
      <div style={{fontSize:56}}>📬</div>
      <div style={{fontFamily:T.display,fontSize:26,fontWeight:300,color:T.forest}}>Confirma tu email</div>
      <div style={{fontSize:14,color:T.muted,lineHeight:1.7,maxWidth:300}}>
        Te enviamos un enlace de confirmación a <strong style={{color:T.ink}}>{email}</strong>.
        Revisa tu bandeja de entrada y haz clic en el enlace para activar tu cuenta.
      </div>
      <div style={{fontSize:12,color:T.muted,background:`${T.amber}12`,border:`1px solid ${T.amber}33`,
        borderRadius:12,padding:"12px 16px",maxWidth:300,lineHeight:1.6}}>
        ¿No llegó? Revisa tu carpeta de spam 📁<br/>
        <strong>Después de confirmar, regresa aquí e inicia sesión.</strong>
      </div>
      <button onClick={()=>{setMode("login");setError("");setMsg("✅ Email confirmado. Ahora ingresa con tu contraseña.");}}
        style={{background:`linear-gradient(135deg,${T.forest},${T.forest}cc)`,border:"none",
          borderRadius:12,padding:"13px 28px",fontSize:14,color:"#fff",cursor:"pointer",
          fontFamily:T.body,fontWeight:500,boxShadow:`0 4px 16px ${T.forest}33`}}>
        Ya confirmé → Iniciar sesión
      </button>
      <button onClick={()=>setMode("login")} style={{background:"transparent",border:"none",
        fontSize:12,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
        Volver
      </button>
    </div>
  );

  return (
    <div style={{height:"100%",overflowY:"auto",background:"#F7F3ED",display:"flex",
      flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}}>

      {/* Logo */}
      <div style={{marginBottom:32,textAlign:"center"}}>
        <div style={{width:72,height:72,borderRadius:22,background:`linear-gradient(145deg,${T.forest}22,${T.amber}22)`,
          border:`1.5px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:36,margin:"0 auto 14px"}}>🌱</div>
        <div style={{fontFamily:T.display,fontSize:40,fontWeight:300,color:T.forest,letterSpacing:-1}}>Grow</div>
        <div style={{fontSize:11,color:T.muted,letterSpacing:2,textTransform:"uppercase",marginTop:2}}>by Building Together</div>
      </div>

      {/* Card */}
      <div style={{width:"100%",maxWidth:400,background:"#fff",borderRadius:20,
        border:`1px solid ${T.border}`,padding:"28px 24px",
        boxShadow:"0 8px 40px rgba(0,0,0,.06)"}}>

        {/* Tab toggle */}
        {mode !== "reset" && (
          <div style={{display:"flex",background:T.bg,borderRadius:12,padding:3,
            border:`1px solid ${T.border}`,marginBottom:24}}>
            {[{id:"login",label:"Ingresar"},{id:"register",label:"Registrarse"}].map(t=>(
              <button key={t.id} onClick={()=>{setMode(t.id);setError("");}}
                style={{flex:1,background:mode===t.id?"#fff":"transparent",
                  border:mode===t.id?`1px solid ${T.border}`:"none",
                  borderRadius:10,padding:"9px",fontSize:13,
                  color:mode===t.id?T.ink:T.muted,cursor:"pointer",
                  fontFamily:T.body,fontWeight:mode===t.id?500:300,transition:"all .2s"}}>
                {t.label}
              </button>
            ))}
          </div>
        )}

        {mode === "reset" && (
          <div style={{marginBottom:20}}>
            <div style={{fontFamily:T.display,fontSize:20,color:T.ink,marginBottom:4}}>Recuperar contraseña</div>
            <div style={{fontSize:12,color:T.muted}}>Te enviaremos un enlace a tu email</div>
          </div>
        )}

        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {/* Email */}
          <div>
            <div style={{fontSize:11,color:T.muted,marginBottom:5,letterSpacing:.5}}>EMAIL</div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="tu@email.com" style={inp}
              onKeyDown={e=>e.key==="Enter"&&(mode==="login"?handleLogin():mode==="reset"?handleReset():null)}/>
          </div>

          {/* Password */}
          {mode !== "reset" && (
            <div>
              <div style={{fontSize:11,color:T.muted,marginBottom:5,letterSpacing:.5}}>CONTRASEÑA</div>
              <div style={{position:"relative"}}>
                <input type={showPass?"text":"password"} value={password}
                  onChange={e=>setPassword(e.target.value)}
                  placeholder={mode==="register"?"Mínimo 8 caracteres":"Tu contraseña"}
                  style={{...inp,paddingRight:44}}
                  onKeyDown={e=>e.key==="Enter"&&mode==="login"&&handleLogin()}/>
                <button onClick={()=>setShowPass(p=>!p)}
                  style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",
                    background:"none",border:"none",cursor:"pointer",fontSize:16,color:T.muted}}>
                  {showPass?"🙈":"👁️"}
                </button>
              </div>
            </div>
          )}

          {/* Confirm password */}
          {mode === "register" && (
            <div>
              <div style={{fontSize:11,color:T.muted,marginBottom:5,letterSpacing:.5}}>CONFIRMAR CONTRASEÑA</div>
              <input type={showPass?"text":"password"} value={confirm}
                onChange={e=>setConfirm(e.target.value)}
                placeholder="Repite tu contraseña" style={inp}/>
            </div>
          )}

          {/* Consent checkbox — required for registration */}
          {mode === "register" && (
            <div style={{background:`${T.forest}06`,border:`1px solid ${T.forest}22`,
              borderRadius:12,padding:"12px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
              <input type="checkbox" id="consent" checked={consent}
                onChange={e=>setConsent(e.target.checked)}
                style={{marginTop:2,width:16,height:16,accentColor:T.forest,cursor:"pointer",flexShrink:0}}/>
              <label htmlFor="consent" style={{fontSize:12,color:T.muted,lineHeight:1.6,cursor:"pointer"}}>
                Acepto los{" "}
                <button onClick={()=>setShowPrivacy(true)}
                  style={{background:"none",border:"none",color:T.forest,cursor:"pointer",
                    fontSize:12,padding:0,textDecoration:"underline"}}>
                  Términos de Uso y Política de Privacidad
                </button>.
                {" "}Mis datos se almacenan en Australia conforme a la Privacy Act 1988 y legislaciones equivalentes de LATAM.
              </label>
            </div>
          )}

          {/* Error / message */}
          {error && (
            <div style={{background:`${T.blush}15`,border:`1px solid ${T.blush}55`,
              borderRadius:10,padding:"10px 14px",fontSize:12,color:"#c0392b"}}>
              {error}
            </div>
          )}
          {msg && (
            <div style={{background:`${T.forest}10`,border:`1px solid ${T.forest}33`,
              borderRadius:10,padding:"10px 14px",fontSize:12,color:T.forest}}>
              {msg}
            </div>
          )}

          {/* Main CTA */}
          <button onClick={mode==="login"?handleLogin:mode==="reset"?handleReset:handleRegister}
            disabled={loading}
            style={{background:loading?"#ccc":`linear-gradient(135deg,${T.forest},${T.forest}cc)`,
              border:"none",borderRadius:12,padding:"14px",fontSize:14,color:"#fff",
              cursor:loading?"not-allowed":"pointer",fontFamily:T.body,fontWeight:500,
              boxShadow:`0 4px 16px ${T.forest}33`,transition:"all .2s",marginTop:4}}>
            {loading ? "⏳ Un momento..." : mode==="login" ? "Ingresar →" : mode==="reset" ? "Enviar enlace" : "Crear cuenta →"}
          </button>

          {/* Secondary actions */}
          <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
            {mode === "login" && (
              <button onClick={()=>{setMode("reset");setError("");setMsg("");}}
                style={{background:"none",border:"none",fontSize:12,color:T.muted,
                  cursor:"pointer",fontFamily:T.body,padding:0,textDecoration:"underline"}}>
                ¿Olvidaste tu contraseña?
              </button>
            )}
            {mode === "reset" && (
              <button onClick={()=>{setMode("login");setError("");setMsg("");}}
                style={{background:"none",border:"none",fontSize:12,color:T.muted,
                  cursor:"pointer",fontFamily:T.body,padding:0}}>
                ← Volver al inicio
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Legal footer */}
      <div style={{marginTop:24,fontSize:10,color:T.muted,textAlign:"center",lineHeight:1.8,maxWidth:320}}>
        🔒 Datos encriptados · Servidores en Sydney, Australia<br/>
        Privacy Act 1988 · LGPD · Ley 1581 · Ley 25.326<br/>
        <button onClick={()=>setShowPrivacy(true)}
          style={{background:"none",border:"none",color:T.forest,cursor:"pointer",
            fontSize:10,padding:0,textDecoration:"underline"}}>
          Ver Política de Privacidad completa
        </button>
      </div>
    </div>
  );
}

// PRIVACY POLICY SCREEN

function PrivacyPolicy({ onBack }) {
  return (
    <div style={{height:"100%",overflowY:"auto",background:"#F7F3ED",padding:"24px 20px 60px"}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:T.forest,

// ACCOUNT SETTINGS (dentro de la app — opción en el menú)
// ═══════════════════════════════════════════════════════════════
function AccountSettings({ session, onSignOut, onDeleteAccount }) {
  const [showDelete, setShowDelete] = useState(false);
  const [deleteReason, setDeleteReason] = useState("");
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState("");

  async function handleDeleteRequest() {
    setLoading(true);
    await supa.requestDeletion(session.access_token, session.user.id, deleteReason);
    setLoading(false);
    setMsg("Solicitud enviada. Eliminaremos tu cuenta y datos en un plazo de 30 días. Te notificaremos por email.");
    setTimeout(()=>onDeleteAccount(), 3000);
  }

  return (
    <div style={{padding:"20px 16px 80px",display:"flex",flexDirection:"column",gap:16}}>
      <div style={{fontFamily:T.display,fontSize:22,fontWeight:300,color:T.ink}}>Mi cuenta</div>

      {/* Email */}
      <div style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 16px"}}>
        <div style={{fontSize:11,color:T.muted,letterSpacing:1,marginBottom:4}}>EMAIL</div>
        <div style={{fontSize:14,color:T.ink}}>{session.user.email}</div>
      </div>

      {/* Data region */}
      <div style={{background:`${T.forest}08`,border:`1px solid ${T.forest}22`,borderRadius:14,padding:"14px 16px",display:"flex",gap:12,alignItems:"flex-start"}}>
        <span style={{fontSize:20}}>🔒</span>
        <div>
          <div style={{fontSize:13,color:T.forest,fontWeight:500,marginBottom:3}}>Datos protegidos</div>
          <div style={{fontSize:11,color:T.muted,lineHeight:1.6}}>
            Almacenados en Sydney, Australia · Privacy Act 1988 · LGPD · Ley 1581
          </div>
        </div>
      </div>

      {/* Re-do onboarding */}
      <button onClick={async ()=>{
          if(!session?.access_token) return;
          await supa.upsertProfile(session.access_token, session.user.id, { active_pillars:[] });
          window.location.reload();
        }}
        style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,
          padding:"14px 16px",fontSize:14,color:T.ink,cursor:"pointer",fontFamily:T.body,
          textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
        <span>🔄</span>
        <div>
          <div>Reconfigurar mi perfil</div>
          <div style={{fontSize:11,color:T.muted,marginTop:2}}>Volver a elegir pilares y propósitos</div>
        </div>
      </button>

      {/* Sign out */}
      <button onClick={onSignOut}
        style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:14,
          padding:"14px 16px",fontSize:14,color:T.ink,cursor:"pointer",fontFamily:T.body,
          textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
        <span>🚪</span> Cerrar sesión
      </button>

      {/* Delete account */}
      {!showDelete ? (
        <button onClick={()=>setShowDelete(true)}
          style={{background:`${T.blush}10`,border:`1px solid ${T.blush}44`,borderRadius:14,
            padding:"14px 16px",fontSize:13,color:T.blush,cursor:"pointer",fontFamily:T.body,
            textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
          <span>🗑️</span> Solicitar eliminación de mi cuenta y datos
        </button>
      ) : (
        <div style={{background:`${T.blush}08`,border:`1.5px solid ${T.blush}44`,borderRadius:16,padding:16,display:"flex",flexDirection:"column",gap:12}}>
          <div style={{fontSize:13,color:T.ink,fontWeight:500}}>¿Eliminar cuenta y todos tus datos?</div>
          <div style={{fontSize:12,color:T.muted,lineHeight:1.6}}>
            Esta acción es irreversible. Eliminaremos tu perfil, tareas e historial en un plazo de 30 días conforme a la Privacy Act 1988 y LGPD.
          </div>
          {msg ? (
            <div style={{fontSize:12,color:T.forest,background:`${T.forest}10`,borderRadius:10,padding:"10px 12px"}}>{msg}</div>
          ) : (
            <>
              <textarea value={deleteReason} onChange={e=>setDeleteReason(e.target.value)}
                placeholder="Motivo (opcional)..."
                rows={2}
                style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,
                  padding:"9px 12px",fontSize:13,color:T.ink,fontFamily:T.body,
                  outline:"none",resize:"none",width:"100%"}}/>
              <div style={{display:"flex",gap:8}}>
                <button onClick={handleDeleteRequest} disabled={loading}
                  style={{flex:1,background:T.blush,border:"none",borderRadius:10,
                    padding:"10px",fontSize:13,color:"#fff",cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
                  {loading ? "Enviando..." : "Confirmar solicitud"}
                </button>
                <button onClick={()=>setShowDelete(false)}
                  style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:10,
                    padding:"10px 14px",fontSize:13,color:T.muted,cursor:"pointer",fontFamily:T.body}}>
                  Cancelar
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// APP ROOT — con autenticación + carga de datos desde Supabase
// ═══════════════════════════════════════════════════════════════
function App() {
  const [authState, setAuthState] = useState("loading"); // loading | auth | onboarding | ready
  const [session,   setSession]   = useState(null);
  const [pillars,   setPillars]   = useState([]);
  const [name,      setName]      = useState("");
  const [birthdate, setBirthdate] = useState("");
  const [gender,    setGender]    = useState("");
  const [profiles,  setProfiles]  = useState({});
  const [propositos,setPropositos]= useState([]);
  const [initTasks, setInitTasks] = useState([]);

  // On mount — try to restore session
  useEffect(() => {
    async function init() {
      const saved = supa.loadSession();
      if (!saved?.access_token) { setAuthState("auth"); return; }

      // Timeout safety — never stay stuck on loading more than 8s
      const timeout = setTimeout(() => {
        console.warn("Auth timeout — clearing session");
        supa.clearSession();
        setAuthState("auth");
      }, 8000);

      let token = saved.access_token;
      let user  = saved.user;

      try {
        // Always try to refresh token first
        if (saved.refresh_token) {
          const refreshed = await supa.refreshToken(saved.refresh_token);
          if (refreshed.access_token) {
            token = refreshed.access_token;
            user  = refreshed.user || user;
            supa.saveSession({ ...saved, access_token: token, refresh_token: refreshed.refresh_token });
          } else {
            // Refresh failed — token expired, need to login again
            clearTimeout(timeout);
            supa.clearSession();
            setAuthState("auth");
            return;
          }
        }
        await loadUserData(token, user);
      } catch(e) {
        console.error("Init error:", e);
        supa.clearSession();
        setAuthState("auth");
      } finally {
        clearTimeout(timeout);
      }
    }
    init();
  }, []);

  async function loadUserData(token, user) {
    try {
      const [profile, tasks] = await Promise.all([
        supa.getProfile(token, user.id),
        supa.getTasks(token, user.id)
      ]);

      // Profile null or empty → needs onboarding
      if (!profile || !profile.active_pillars || profile.active_pillars.length === 0) {
        setSession({ access_token: token, user });
        setAuthState("onboarding");
        return;
      }

      if (profile?.active_pillars?.length > 0) {
        setName(profile.name || "");
        setBirthdate(profile.birthdate || "");
        setGender(profile.gender || "");
        setPillars(profile.active_pillars || []);
        setProfiles(profile.pillar_profiles || {});
        setPropositos(profile.propositos || []);
        // Convert DB tasks to app format
        setInitTasks(tasks.map(t=>({
          id: t.id, pillarId: t.pillar_id, text: t.text,
          dueDate: t.due_date, time: t.time, done: t.done,
          doneAt: t.done_at, recurring: t.recurring
        })));
        setSession({ access_token: token, user });
        setAuthState("ready");
      }
    } catch(e) {
      console.error("loadUserData error:", e);
      supa.clearSession();
      setAuthState("auth");
    }
  }

  async function handleAuth(token, user) {
    const sess = { access_token: token, user };
    setSession(sess);
    await loadUserData(token, user);
  }

  async function handleOnboardingDone(ids, n, bd, g, pp, props) {
    setPillars(ids); setName(n); setBirthdate(bd);
    setGender(g); setProfiles(pp); setPropositos(props||[]);

    // Use current session state (already set before onboarding)
    const tok = session?.access_token;
    const uid = session?.user?.id;

    if (tok && uid) {
      try {
        await supa.upsertProfile(tok, uid, {
          name: n, birthdate: bd, gender: g,
          active_pillars: ids, propositos: props||[],
          pillar_profiles: pp
        });
        await supa.logConsent(tok, uid);
      } catch(e) {
        console.error("Profile save error:", e);
      }
    }
    setAuthState("ready");
  }

  async function handleSignOut() {
    try { await supa.signOut(session?.access_token); } catch(e) {}
    supa.clearSession();
    setAuthState("auth");
    setSession(null); setPillars([]); setName(""); setBirthdate("");
    setGender(""); setProfiles({}); setPropositos([]); setInitTasks([]);
  }

  const [loadingSec, setLoadingSec] = useState(0);
  useEffect(() => {
    if (authState !== "loading") return;
    const t = setInterval(() => setLoadingSec(s => s+1), 1000);
    return () => clearInterval(t);
  }, [authState]);

  if (authState === "loading") return (
    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",
      background:"#F7F3ED",flexDirection:"column",gap:14,padding:32,textAlign:"center"}}>
      <div style={{fontSize:40,animation:"bt-float 2s ease-in-out infinite"}}>🌱</div>
      <div style={{fontFamily:T.display,fontSize:18,color:T.forest,fontStyle:"italic"}}>Grow</div>
      <div style={{fontSize:13,color:T.muted}}>
        {loadingSec < 4 ? "Cargando tu perfil..." : "Conectando con el servidor..."}
      </div>
      {loadingSec >= 6 && (
        <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:8}}>
          <div style={{fontSize:12,color:T.muted}}>Está tardando más de lo normal</div>
          <button onClick={()=>{ supa.clearSession(); setAuthState("auth"); }}
            style={{background:T.forest,border:"none",borderRadius:12,padding:"11px 24px",
              fontSize:13,color:"#fff",cursor:"pointer",fontFamily:T.body,fontWeight:500}}>
            Ir al inicio de sesión
          </button>
        </div>
      )}
    </div>
  );

  if (authState === "auth") return <AuthScreen onAuth={handleAuth}/>;

  if (authState === "onboarding") return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden",background:"#EDE8E0"}}>
      <Onboarding onDone={handleOnboardingDone}/>
    </div>
  );

  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",overflow:"hidden",background:"#EDE8E0"}}>
      <MainApp
        activePillarIds={pillars} userName={name} birthdate={birthdate}
        gender={gender} pillarProfiles={profiles} propositos={propositos}
        onPropositosChange={async (vals)=>{
          setPropositos(vals);
          if (session?.access_token) {
            try { await supa.upsertProfile(session.access_token, session.user.id, { propositos: vals }); } catch(e) {}
          }
        }}
        initialTasks={initTasks}
        session={session}
        onSignOut={handleSignOut}
      />
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><App/></ErrorBoundary>
    );
  </script>
  <script>
    document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
    if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});
    window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('fade');setTimeout(function(){s.remove()},700)}},2000)});
    var _dp=null;
    window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_dp=e;setTimeout(function(){var b=document.getElementById('install-banner');if(b)b.classList.add('show')},3500)});
    var ib=document.getElementById('install-btn');if(ib)ib.addEventListener('click',function(){if(!_dp)return;_dp.prompt();_dp.userChoice.then(function(){_dp=null;var b=document.getElementById('install-banner');if(b)b.remove()})});
    var db=document.getElementById('dismiss-btn');if(db)db.addEventListener('click',function(){var b=document.getElementById('install-banner');if(b)b.remove()});
  </script>
